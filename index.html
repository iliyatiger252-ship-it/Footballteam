  else if(res==='save') o=oneOf(['ضربه… {K} درست حدس زد!!\nمهار کرد!','شوت محکم…\n{K} با دست دفعش کرد!!']);
  else o=oneOf(['شوت… بالای دروازه!!','ضربه… تیرک!!\nبیرون اومد!']);
  return L(pre,F(o));
}

/* ================= موتور بازی: تیم‌ها، برنامه‌ی دقیقه‌ها، پنالتی ================= */
const GRP=c=>c==='GK'?'gk':['CB','RB','LB'].includes(c)?'def':['CDM','CM','CAM','RM','LM'].includes(c)?'mid':'fwd';
function buildMT(){
  return [0,1].map(t=>{
    const players=D.slots[t].map((s,i)=>{
      const pk=D.pick[t][i], p=PL[pk.pid];
      return {sid:i,c:s.c,g:GRP(s.c),p,wrong:pk.wrong,ov:p.ov-(pk.wrong?8:0),im:p.im||[],ex:p.ex||[],nm:pn(p),yc:0,red:false,goals:0,ast:0,sv:0,rate:0};
    });
    const co=COACHES[D.coach[t]];
    const avg=(players.reduce((a,x)=>a+x.ov,0)+co.ov)/12;
    return {t,name:tname(t),form:G.teams[t].form,players,gk:players.find(x=>x.c==='GK'),co:Object.assign({},co,{im:co.im||[],ex:co.ex||[]}),cn:pn(co),avg,
      pen:players[D.pen[t]],set:players[D.set[t]]};
  });
}
function oddsFor(T){
  const gap=Math.abs(T[0].avg-T[1].avg), strong=T[0].avg>=T[1].avg?0:1;
  return {gap,strong,ps:gap>=5?.7:gap>=4?.6:.5};
}
const W_SHOT={ST:10,CF:7.5,RW:7,LW:7,CAM:5,RM:4,LM:4,CM:2.5,CDM:1.1,RB:1,LB:1,CB:.6,GK:0};
const W_HEAD={ST:8,CF:5,RW:3,LW:3,CAM:2,RM:1.5,LM:1.5,CM:2,CDM:2,RB:1,LB:1,CB:6,GK:0};
const W_LONG={ST:3,CF:4,RW:3,LW:3,CAM:7,RM:5,LM:5,CM:7,CDM:5,RB:1.5,LB:1.5,CB:.5,GK:0};
const W_CRE={CAM:8,CM:6,RM:7,LM:7,RW:6,LW:6,CF:7,CDM:3,RB:3.5,LB:3.5,ST:3,CB:1,GK:.3};
const W_DEF={CB:8,RB:5,LB:5,CDM:4,CM:1.5,CAM:.5,RM:1,LM:1,CF:.2,ST:.2,RW:.2,LW:.2,GK:0};
const live=X=>X.players.filter(p=>!p.red);
function pShooter(X,kind,ex){
  const W=kind==='head'?W_HEAD:kind==='long'?W_LONG:W_SHOT;
  return wpick(live(X).filter(p=>p!==ex&&p.c!=='GK'),p=>{
    let w=(W[p.c]||0)*Math.pow(p.ov/90,6);
    if(kind==='head'){ if(hasT(p,'head'))w*=2; if(hasT(p,'air'))w*=1.7; if(hasT(p,'headx'))w*=2.2; if(hasT(p,'hdset'))w*=2; }
    else if(kind==='long'){ if(hasT(p,'lsh'))w*=2.2; if(hasT(p,'lshx'))w*=2; }
    else if(kind==='solo'){ if(hasT(p,'dribx'))w*=2; if(hasT(p,'burst'))w*=2; if(hasT(p,'spd'))w*=1.5; if(hasT(p,'drib'))w*=1.5; }
    else { if(hasT(p,'fin'))w*=1.7; if(hasT(p,'finx'))w*=1.6; if(hasT(p,'behind'))w*=1.2; if(hasT(p,'drib'))w*=1.1; if(kind==='fast'){ if(hasT(p,'behind'))w*=1.8; if(hasT(p,'spd'))w*=1.5; if(hasT(p,'burst'))w*=1.5; } }
    return w;
  });
}
function pCreator(X,ex,kind){
  return wpick(live(X).filter(p=>p!==ex),p=>{
    let w=(W_CRE[p.c]||1)*Math.pow(p.ov/90,6);
    if(hasT(p,'key'))w*=1.5; if(hasT(p,'thru'))w*=1.5; if(hasT(p,'drib'))w*=1.2;
    if(kind==='cross'){ if(hasT(p,'cross'))w*=2.5; if(hasT(p,'crossx'))w*=1.8; if(hasT(p,'wing'))w*=1.8; if(['RM','LM','RB','LB','RW','LW'].includes(p.c))w*=1.8; }
    if(kind==='counter'){ if(hasT(p,'icpt'))w*=2; if(hasT(p,'press'))w*=1.6; if(hasT(p,'cnt'))w*=1.4; }
    return w;
  });
}
function pStarter(X,ex){
  const W={CB:4,CDM:4,CM:4,RB:3,LB:3,CAM:1.5,GK:1.5,RM:1,LM:1};
  const c=live(X).filter(p=>!ex.includes(p)&&W[p.c]);
  return c.length?wpick(c,p=>W[p.c]):null;
}
function pDefender(Y,opts){
  opts=opts||{};
  return wpick(live(Y).filter(p=>p.c!=='GK'&&!(opts.noYc&&p.yc>0)),p=>{
    let w=(W_DEF[p.c]||.3); if(p.wrong) w*=2.2; if(opts.hand&&p.g==='def') w*=1.2;
    return w;
  });
}
const taker=(X,key)=>{ const p=X[key]; if(p&&!p.red) return p; return live(X).filter(q=>q.c!=='GK').sort((a,b)=>b.ov-a.ov)[0]; };

/* ---------- انتخاب نوع گل و نوع صحنه ---------- */
function pickGoalType(X,S){
  const w={open:28,cross:15,solo:11,long:10,counter:10,corner:9,fk:8,pen:S.refTr==='pen'?20:S.refTr==='strict'?8:S.refTr==='lax'?3:6};
  if(hasT(X.co,'cnt')) w.counter+=8;
  if(X.players.some(p=>hasT(p,'lsh')||hasT(p,'lshx'))) w.long+=4;
  const st=X.set;
  if(st&&(hasT(st,'fkx')||hasT(st,'fk'))) w.fk+=6;
  if(X.players.some(p=>hasT(p,'headx')||hasT(p,'hdset'))){ w.corner+=5; w.cross+=4; }
  if(X.players.some(p=>hasT(p,'dribx')||hasT(p,'burst'))) w.solo+=6;
  const caps={pen:2,fk:2,corner:2,long:2};
  const ks=Object.keys(w).filter(k=>!(caps[k]&&(S.cnt['g_'+k]||0)>=caps[k]));
  return wpick(ks,k=>w[k]/(1+(S.cnt['g_'+k]||0)*.9));
}
const EVBASE={save:22,post:8,block:8,duel:8,offside:9,varno:2.5,corner:9,fkmiss:8,yellow:10,red:1.3,injury:3,penmiss:3.5,penno:3,clear:5,counter:5,miss:7};
const EVCAP={red:1,injury:1,penmiss:1,penno:1,offside:2,varno:1,yellow:3,post:2,clear:1,fkmiss:2,corner:3};
function pickType(S){
  const R=S.refTr, m={
    strict:{yellow:2.2,red:2.2,penmiss:1,penno:.8},mid:{},pen:{yellow:1,red:.4,penmiss:3,penno:.3},lax:{yellow:.4,red:0,penmiss:.5,penno:2.2}
  }[R]||{};
  const cap=Object.assign({},EVCAP); if(R==='strict') cap.yellow=4;
  const ks=Object.keys(EVBASE).filter(k=>!(cap[k]&&(S.cnt['e_'+k]||0)>=cap[k])&&k!==S.lastType&&!(k==='red'&&R==='lax'));
  return wpick(ks,k=>EVBASE[k]*(m[k]!=null?m[k]:1)/(1+(S.cnt['e_'+k]||0)*.4));
}

/* ---------- ساخت یک صحنه ---------- */
function makeEvent(S,half,min,goal,et,kick){
  const T=S.T;
  let t, type, gt=null;
  if(goal){ t=goal.t; type='goal'; gt=pickGoalType(T[t],S); S.cnt['g_'+gt]=(S.cnt['g_'+gt]||0)+1; }
  else {
    let p0=.5+(T[0].avg-T[1].avg)*.012; p0=Math.max(.38,Math.min(.62,p0));
    t=chance(p0)?0:1;
    if(S.regroup!=null&&chance(.7)){ t=S.regroup; }
    S.regroup=null;
    type=pickType(S); S.cnt['e_'+type]=(S.cnt['e_'+type]||0)+1;
  }
  // برای کارت/خطا، تیم مهاجم همان قربانی است؛ مدافع از تیم مقابل
  const X=T[t], Y=T[1-t];
  const ev={type,min,half,et:!!et,t,gt,A:null,B:null,D:null,S:null,Q:null,kick:kick||null,pre:S.score.slice()};
  const withCre=chance(.85);
  switch(type){
    case 'goal':
      if(gt==='open'){ ev.B=pShooter(X,'fin'); ev.A=pCreator(X,ev.B); ev.D=pDefender(Y); }
      else if(gt==='cross'){ ev.B=pShooter(X,'head'); ev.A=pCreator(X,ev.B,'cross'); ev.D=pDefender(Y); }
      else if(gt==='solo'){ ev.B=pShooter(X,'solo'); ev.D=pDefender(Y); }
      else if(gt==='long'){ ev.B=pShooter(X,'long'); ev.A=chance(.7)?pCreator(X,ev.B):null; ev.D=pDefender(Y); }
      else if(gt==='counter'){ ev.B=pShooter(X,'fast'); ev.A=pCreator(X,ev.B,'counter'); ev.D=pDefender(Y); }
      else if(gt==='corner'){ ev.S=taker(X,'set'); ev.A=ev.S; ev.B=pShooter(X,'head',ev.S); ev.D=pDefender(Y); }
      else if(gt==='fk'){ ev.S=taker(X,'set'); ev.B=ev.S; ev.A=pCreator(X,ev.S); ev.D=pDefender(Y); }
      else { ev.S=taker(X,'pen'); ev.B=ev.S; ev.A=pCreator(X,ev.S); ev.D=pDefender(Y,{hand:1}); ev.foulKind=chance(.25)?'hand':'foul'; }
      break;
    case 'corner': ev.S=taker(X,'set'); ev.A=ev.S; ev.B=pShooter(X,'head',ev.S); ev.D=pDefender(Y); break;
    case 'fkmiss': ev.S=taker(X,'set'); ev.A=pCreator(X,ev.S); ev.B=ev.S; ev.D=pDefender(Y); break;
    case 'penmiss': ev.S=taker(X,'pen'); ev.B=ev.S; ev.A=pCreator(X,ev.S); ev.D=pDefender(Y,{hand:1}); ev.foulKind=chance(.25)?'hand':'foul';
      ev.res=chance(hasT(Y.gk,'pensv')?.8:.55)?'save':'miss'; break;
    case 'penno': ev.A=pCreator(X); ev.D=pDefender(Y); ev.B=ev.A; break;
    case 'yellow': ev.A=pCreator(X); ev.D=pDefender(Y,{noYc:1}); ev.B=ev.A; ev.D.yc++; S.cards[1-t]++; break;
    case 'red': ev.A=pCreator(X); ev.D=pDefender(Y,{noYc:0}); ev.B=ev.A; ev.D.red=true; S.cards[1-t]+=2; S.reds=(S.reds||0)+1; break;
    case 'injury': ev.B=wpick(live(X).filter(p=>p.c!=='GK'),p=>1); break;
    case 'duel': ev.B=pShooter(X,'fast'); ev.A=withCre?pCreator(X,ev.B):null; ev.D=pDefender(Y); break;
    default: // save post block offside varno clear counter miss
      ev.B=pShooter(X,type==='counter'?'fast':'fin'); ev.A=withCre?pCreator(X,ev.B,type==='counter'?'counter':null):null; ev.D=pDefender(Y);
  }
  if(type!=='corner'&&type!=='injury'&&!(type==='goal'&&gt==='corner')&&!(type==='goal'&&gt==='solo'&&false)&&(ev.A||ev.B)&&type!=='counter'&&!(type==='goal'&&gt==='counter')&&chance(.85)) ev.Q=pStarter(X,[ev.A,ev.B,ev.S]);
  if((type==='counter'||type==='yellow'||type==='red'||type==='penno')&&!ev.A) ev.A=pCreator(X,ev.B);
  if(type==='counter'&&!ev.B) ev.B=pShooter(X,'fast');
  // آمار
  if(['goal','save','post','block','miss','duel','clear','offside','fkmiss'].includes(type)) S.sh[t]++;
  if(['goal','save','post','clear'].includes(type)) S.on[t]++;
  if(type==='corner'||(type==='save'&&chance(.4))) S.cor[t]++;
  if(type==='goal'){
    ev.B.goals++; ev.B.rate+=3; if(ev.A&&ev.A!==ev.B){ ev.A.ast++; ev.A.rate+=2; }
    S.score[t]++; Y.gk.rate-=.5;
    if(Y.co.ex.includes('regroup')) S.regroup=1-t;
  } else {
    if(type==='save'){ Y.gk.sv++; Y.gk.rate+=1.5; }
    if(type==='penmiss'&&ev.res==='save'){ Y.gk.sv++; Y.gk.rate+=2.5; }
    if(type==='block'||type==='clear'||type==='duel') ev.D.rate+=1;
    if(type==='post') ev.B.rate+=.5;
    if(type==='clear') { S.sh[t]+=0; }
  }
  S.lastType=type;
  ev.score=S.score.slice();
  ev.paras=writeEvent(ev,X,Y,S);
  ev.tn=X.name; ev.t=t;
  return ev;
}

/* ---------- زمان‌بندی یک نیمه ---------- */
function slotMinutes(n,lo,hi){
  const out=[], span=(hi-lo+1)/n;
  for(let i=0;i<n;i++){
    const a=Math.round(lo+i*span), b=Math.round(lo+(i+1)*span-1);
    out.push(ri(Math.min(a+1,b),Math.max(a+1,b-1)));
  }
  return out;
}
function genHalf(S,half,lo,hi,goals,nr,et,kick){
  const n=Math.max(goals.length,ri(nr[0],nr[1])), mins=slotMinutes(n,lo,hi);
  const gset=new Set(shuf([...Array(n).keys()]).slice(0,goals.length)), gl=shuf(goals);
  let gi=0; const evs=[];
  mins.forEach((m,i)=>{
    const ev=makeEvent(S,half,m,gset.has(i)?gl[gi++]:null,et,i===0?kick:null);
    evs.push(ev);
  });
  return evs;
}
const kickPlayer=X=>(X.players.find(p=>p.c==='ST')||X.players.find(p=>p.c==='CF')||X.players.find(p=>p.c==='CAM')||X.players.find(p=>p.c==='CM')||X.players[10]);

/* ---------- برنامه‌ی کل بازی ---------- */
function planMatch(){
  USED=new Set();
  const T=buildMT(), od=oddsFor(T), ref=REFS[D.ref];
  const S={T,od,refTr:ref.tr,refNm:pn(ref),score:[0,0],cnt:{},sh:[0,0],on:[0,0],cor:[0,0],cards:[0,0],regroup:null,lastType:null};
  // نتیجه‌ی ۹۰ دقیقه
  let w; if(chance(.22)) w=-1; else w=chance(od.ps)?od.strong:1-od.strong;
  let g=[0,0];
  if(w<0){ const k=wpick([0,1,2,3],x=>[.15,.46,.31,.08][x]); g=[k,k]; }
  else {
    const a=wpick([1,2,3,4],x=>[.34,.4,.19,.07][x-1]);
    const b=wpick([...Array(a).keys()],x=>[.5,.38,.12,.05][x]);
    g[w]=a; g[1-w]=b;
  }
  const goals=[{t:0,n:g[0]},{t:1,n:g[1]}].flatMap(o=>Array.from({length:o.n},()=>({t:o.t})));
  const h1=[],h2=[];
  shuf(goals).forEach(x=>{
    const c1=h1.length>=4, c2=h2.length>=4;
    (c1?false:c2?true:chance(.44))?h1.push(x):h2.push(x);
  });
  const coinW=G.coin?G.coin.winner:0;
  const P=t=>({nm:kickPlayer(T[t]).nm,team:T[t].name});
  const segs=[];
  const e1=genHalf(S,1,2,44,h1,[4,6],false,Object.assign({key:'h1'},P(coinW)));
  segs.push({key:'h1',evs:e1,from:0,to:45,label:'نیمه‌ی اول',per:'نیمه اول'});
  const e2=genHalf(S,2,46,89,h2,[4,6],false,Object.assign({key:'h2'},P(1-coinW)));
  segs.push({key:'h2',evs:e2,from:45,to:90,label:'نیمه‌ی دوم',per:'نیمه دوم'});
  const pStr=od.ps;
  if(w<0){
    const r=Math.random(); let a1=[],a2=[];
    const win=chance(od.ps)?od.strong:1-od.strong;
    if(r<.35){ (chance(.5)?a1:a2).push({t:win}); }
    else if(r<.5){ const f=chance(.5)?0:1; a1.push({t:f}); a2.push({t:1-f}); }
    const k0=chance(.5)?0:1;
    const x1=genHalf(S,3,92,104,a1,[2,3],true,Object.assign({key:'e1'},P(k0)));
    segs.push({key:'e1',evs:x1,from:90,to:105,label:'نیمه‌ی اول وقت اضافه',per:'وقت اضافه ۱'});
    const x2=genHalf(S,4,107,119,a2,[2,3],true,Object.assign({key:'e2'},P(1-k0)));
    segs.push({key:'e2',evs:x2,from:105,to:120,label:'نیمه‌ی دوم وقت اضافه',per:'وقت اضافه ۲'});
  }
  const tied=S.score[0]===S.score[1];
  const pens=tied?planPens(S):null;
  return {T,S,segs,final:S.score.slice(),pens,od};
}

/* ---------- ضربات پنالتی ---------- */
function decidedPK(s,n){
  const l0=Math.max(0,5-n[0]), l1=Math.max(0,5-n[1]);
  if(n[0]<=5&&n[1]<=5){ if(s[0]>s[1]+l1) return 0; if(s[1]>s[0]+l0) return 1; }
  if(n[0]>=5&&n[1]>=5&&n[0]===n[1]&&s[0]!==s[1]) return s[0]>s[1]?0:1;
  return -1;
}
function planPens(S){
  const T=S.T, od=S.od;
  const pw=od.ps>.5?.5+(od.ps-.5)*.45:.5;
  let want=chance(pw)?od.strong:1-od.strong;
  if(hasT(T[0].gk,'pensv')&&!hasT(T[1].gk,'pensv')) want=chance(.58)?0:want;
  if(hasT(T[1].gk,'pensv')&&!hasT(T[0].gk,'pensv')) want=chance(.58)?1:want;
  const ord=T.map(X=>{
    const f=live(X).filter(p=>p.c!=='GK'&&p!==taker(X,'pen')).sort((a,b)=>b.ov-a.ov);
    return [taker(X,'pen'),...f,X.gk];
  });
  let best=null;
  for(let tries=0;tries<500;tries++){
    const first=chance(.5)?0:1, s=[0,0], n=[0,0], ks=[]; let win=-1, guard=0;
    while(win<0&&guard++<60){
      for(const k of [first,1-first]){
        const X=T[k], Y=T[1-k], p=ord[k][n[k]%ord[k].length];
        let ps=.76+(p.ov-90)*.004; if(hasT(p,'penx')) ps+=.1; if(p.c==='GK') ps-=.15;
        if(hasT(Y.gk,'pensv')) ps-=.1; if(hasT(Y.gk,'reflx')) ps-=.03; ps=Math.max(.5,Math.min(.93,ps));
        const sc=chance(ps);
        const s1=s.slice(), n1=n.slice(); n1[k]++; if(sc) s1[k]++;
        const gW=s.slice(); gW[k]++; const nn=n.slice(); nn[k]++;
        const winIfGoal=decidedPK(gW,nn)===k, loseIfMiss=decidedPK(s,nn)===1-k;
        let res='goal';
        if(!sc) res=chance(hasT(Y.gk,'pensv')?.8:.6)?'save':(chance(.5)?'post':'miss');
        ks.push({t:k,p,K:Y.gk,res,crit:winIfGoal?'win':loseIfMiss?'must':'',idx:n[k]+1,tn:X.name,after:[...s1]});
        s[k]=s1[k]; n[k]=n1[k];
        win=decidedPK(s,n); if(win>=0) break;
      }
    }
    if(win>=0){ best={kicks:ks,winner:win,score:[...s]}; if(win===want) break; }
  }
  return best;
}

/* ---------- توپ چرخان و جلو رفتن ساعت ---------- */
function interlude(target,done){
  MT.phase='ball'; lockChrome();
  const T=MT.plan.T;
  const v=view('bv',`<div class="bring">${ballSVG()}</div><div class="btx" id="btx">${BALLTXT[ri(0,BALLTXT.length-1)]}</div><div class="bsh"></div>`);
  const mv=$m('#mv'); if(mv){ mv.style.setProperty('--c0',tcol2(0)); mv.style.setProperty('--c1',tcol2(1)); }
  Arena.calm();
  const from=MT.clock, steps=Math.max(1,target-from), dur=Math.min(4800,Math.max(2800,steps*110)), step=dur/steps;
  let cur=from, k=0;
  later(()=>{
    MT.iv=setInterval(()=>{
      cur++; setClock(cur);
      if(cur>=target){ clearInterval(MT.iv); MT.iv=null; later(done,420); }
    },step);
  },500);
  const tx=setInterval(()=>{ const e=$m('#btx'); if(!e||MT.phase!=='ball'){ clearInterval(tx); return; } k=(k+1)%BALLTXT.length; e.style.opacity=0; setTimeout(()=>{ if(e){ e.textContent=BALLTXT[k]; e.style.opacity=1; } },220); },1700);
}

/* ---------- صفحه‌ی گزارش ---------- */
const CUE={yellow:'card',red:'card',injury:'short',offside:'short',varno:'short',penmiss:'short',penno:'short'};
function showReport(ev){
  MT.phase='report'; MT.cur=ev; setClock(ev.min); lockChrome();
  const t=ev.t;
  let dl=.1; const body=ev.paras.map(p=>{ const ls=p.split('\n').map(l=>{ const s=`<span style="animation-delay:${dl.toFixed(2)}s">${esc(l)}</span>`; dl+=.42; return s; }).join(''); dl+=.25; return `<p>${ls}</p>`; }).join('');
  view('rp',`<div class="rph"><span class="rpm"><small>دقیقه</small>${fa(ev.min)}</span><span class="rpt"><i class="sbc" style="--tc:${tcol2(t)}"></i>${esc(ev.tn)}</span></div><div class="rpb" id="rpb">${body}</div><button class="cta rd" id="rd">خوندم</button>`);
  Arena.tense();
  const c=CUE[ev.type]; if(c) Arena[c]();
  if(ev.type==='post') later(()=>Arena.clank(),1400);
  if(ev.type==='save') later(()=>Arena.save(),1400);
  $m('#rd').onclick=()=>onRead(ev);
  const rb=$m('#rpb'); const chk=()=>rb.classList.toggle('sc',rb.scrollHeight-rb.scrollTop-rb.clientHeight>8); chk(); rb.addEventListener('scroll',chk);
}
function onRead(ev){
  const b=$m('#rd'); if(!b||b.disabled) return; b.disabled=true;
  if(ev.type==='goal'){
    setScore(ev.score,ev.t);
    MT.goals.push({t:ev.t,nm:ev.B.nm,full:ev.B.p.fa,min:ev.min,gt:ev.gt});
    Arena.net(); Arena.cheer(true);
    const v=$m('#mv'); const g=document.createElement('div'); g.className='gbn'; g.style.setProperty('--tc',tcol2(ev.t));
    g.innerHTML=`<b>گوووول!</b><strong>${esc(ev.B.p.fa)}</strong><span>${esc(ev.tn)} · دقیقه ${fa(ev.min)}</span>`;
    if(v) v.appendChild(g);
    later(()=>{ g.remove(); afterRead(); },3100);
  } else if(ev.type==='offside'||ev.type==='varno'){
    Arena.groan();
    const v=$m('#mv'); const g=document.createElement('div'); g.className='gbn no'; 
    g.innerHTML=`<b>گل مردود شد!</b><span>${ev.type==='offside'?'آفساید':'بررسی VAR'}</span>`;
    if(v) v.appendChild(g);
    later(()=>{ g.remove(); afterRead(); },2200);
  } else {
    if(ev.type==='save'||ev.type==='post'||ev.type==='clear'||ev.type==='miss') Arena.gasp();
    else if(ev.type==='penmiss') Arena.groan();
    later(afterRead,400);
  }
}
function afterRead(){
  const sg=seg(); MT.ei++;
  if(MT.ei<sg.evs.length){ const e=sg.evs[MT.ei]; interlude(e.min,()=>showReport(e)); }
  else interlude(sg.to,segEnd);
}

/* ---------- آمار ---------- */
function statsUpTo(n){
  const o={sh:[0,0],on:[0,0],cor:[0,0],cd:[0,0],pos:0};
  for(let i=0;i<=n;i++){
    const sg=MT.plan.segs[i], pd=MT.pad[i];
    [0,1].forEach(t=>{ o.sh[t]+=pd.sh[t]; o.on[t]+=pd.on[t]; o.cor[t]+=pd.cor[t]; });
    o.pos+=pd.pos;
    sg.evs.forEach(e=>{
      const t=e.t;
      if(['goal','save','post','block','miss','duel','clear','offside','fkmiss'].includes(e.type)) o.sh[t]++;
      if(e.type==='goal'||e.type==='save') o.on[t]++;
      if(e.type==='corner') o.cor[t]++;
      if(e.type==='yellow') o.cd[1-t]++;
      if(e.type==='red') o.cd[1-t]+=2;
    });
  }
  o.pos=Math.round(o.pos/(n+1));
  return o;
}
function statRows(n){
  const s=statsUpTo(n), T=MT.plan.T;
  const row=(lab,a,b,pc)=>{ const tot=(a+b)||1, pa=pc?a:Math.round(a/tot*100);
    return `<div class="st"><b>${fa(a)}${pc?'٪':''}</b><span>${lab}</span><b>${fa(b)}${pc?'٪':''}</b><div class="stb"><i style="width:${pa}%;background:${tcol2(0)}"></i><i style="width:${100-pa}%;background:${tcol2(1)}"></i></div></div>`; };
  return row('مالکیت توپ',s.pos,100-s.pos,true)+row('شوت',s.sh[0],s.sh[1])+row('شوت در چارچوب',Math.min(s.on[0],s.sh[0]),Math.min(s.on[1],s.sh[1]))+row('کرنر',s.cor[0],s.cor[1])+row('کارت',s.cd[0],s.cd[1]);
}
const gtTag=g=>g==='pen'?' (پنالتی)':g==='fk'?' (ضربه‌ی آزاد)':'';
function goalList(){
  const T=MT.plan.T;
  if(!MT.goals.length) return '<div class="gl0">هنوز گلی به ثمر نرسیده است</div>';
  return [0,1].map(t=>{
    const gs=MT.goals.filter(g=>g.t===t);
    return `<div class="glc"><b><i class="sbc" style="--tc:${tcol2(t)}"></i>${esc(T[t].name)}</b>${gs.length?gs.map(g=>`<span>⚽ ${esc(g.full)} ${fa(g.min)}'${gtTag(g.gt)}</span>`).join(''):'<span class="mu">—</span>'}</div>`;
  }).join('');
}

function pkRender(mode,k){

/* ---------- پایان بازی ---------- */
function motm(){
  const all=MT.plan.T.flatMap(X=>X.players.map(p=>({p,X})));
  const win=winnerIdx();
  let best=null,bv=-1e9;
  all.forEach(o=>{ const v=o.p.rate+(o.X.t===win?1.2:0)+o.p.ov/200+Math.random()*.3; if(v>bv){ bv=v; best=o; } });
  return best;
}
function winnerIdx(){
  if(MT.score[0]!==MT.score[1]) return MT.score[0]>MT.score[1]?0:1;
  return MT.plan.pens?MT.plan.pens.winner:0;
}
function finish(){
  MT.phase='final'; setPer('پایان بازی'); lockChrome();
  const T=MT.plan.T, w=winnerIdx(), pens=MT.plan.pens&&MT.score[0]===MT.score[1];
  const m=motm();
  const why=[]; if(m.p.goals) why.push(fa(m.p.goals)+' گل'); if(m.p.ast) why.push(fa(m.p.ast)+' پاس گل'); if(m.p.sv) why.push(fa(m.p.sv)+' سیو'); if(!why.length) why.push('درخشش در کل بازی');
  const conf=Array.from({length:34},(_,i)=>`<i style="left:${ri(2,98)}%;--d:${(Math.random()*1.6).toFixed(2)}s;--t:${(2.6+Math.random()*2).toFixed(1)}s;background:${[tcol(w),'#f6c453','#ffffff','#ff6a2b'][i%4]}"></i>`).join('');
  const pk=pens?`<div class="fpk"><b>${MT.plan.pens.score[0]}</b><span>ضربات پنالتی</span><b>${MT.plan.pens.score[1]}</b></div>`:'';
  view('fin',`<div class="conf">${conf}</div><div class="fsc">
    <div class="fcup">🏆</div><div class="fttl">پایان بازی</div>
    <div class="fwin" style="--tc:${tcol2(w)}"><i class="sbc" style="--tc:${tcol2(w)}"></i>${esc(T[w].name)} برنده شد!</div>
    <div class="bks"><b>${MT.score[0]}</b><em>:</em><b>${MT.score[1]}</b></div>${pk}
    <div class="gls">${goalList()}</div>
    <div class="mom"><div class="momj" style="--jc:${tcol2(m.X.t)}">${JERSEY(m.X.t)}</div><div><small>بهترین بازیکن زمین</small><b>${esc(m.p.p.fa)}</b><span>${esc(why.join(' · '))}</span></div></div>
    <div class="sts">${statRows(MT.plan.segs.length-1)}</div>
    <div class="fbt"><button class="cta" id="again">بازی دوباره با همین ترکیب‌ها</button><button class="ghost" id="fresh">شروع از اول</button></div></div>`);
  Arena.crowd(); Arena.end(); later(()=>{ Arena.fanfare(); },1300); later(()=>Arena.crowdOff(),9000);
  $m('#again').onclick=()=>{ MT=null; clearTimers(); paint(0); };
  let armed=false;
  $m('#fresh').onclick=()=>{ const b=$m('#fresh'); if(!armed){ armed=true; b.textContent='مطمئنی؟ دوباره بزن'; later(()=>{ armed=false; if(b) b.textContent='شروع از اول'; },3500); } else location.reload(); };
}

function chrome(){
  const st=STEPS[state.step], last=state.step===STEPS.length-1;
  const okNow=st.ok?st.ok():true;
  lab.querySelector('b').textContent=st.label;
  lab.querySelector('small').textContent=`مرحله‌ی ${fa(state.step+1)} از ${fa(STEPS.length)}`;
  [...dots.children].forEach((d,i)=>{ d.className=i===state.step?'on':(i<=state.max?'seen':''); });
  btnBack.disabled=ui.busy||state.step===0||!!(st.lock&&st.lock());
  btnFwd.disabled=ui.busy||state.step>=state.max||!okNow;
  const label=typeof st.cta==='function'?st.cta():(st.cta||'بعدی');
  btnNext.textContent=last?'پایان':label;
  btnNext.disabled=ui.busy||last||!okNow;
  if(st.btn){ const b=st.btn(); btnNext.textContent=b.label; btnNext.disabled=ui.busy||last||!b.enabled; }
  if(st.ttl) lab.querySelector('b').textContent=st.ttl();
}
function paint(dir){
  const old=stage.firstElementChild; if(old&&old._off){ try{old._off()}catch(e){} }
  const st=STEPS[state.step];
  const el=document.createElement('section');
  el.className='screen '+(dir>0?'in-fwd':dir<0?'in-back':'in-first');
  (SCREENS[st.id]||(e=>{e.innerHTML=placeholder(st,state.step);}))(el);
  document.body.dataset.step=st.id;
  try{Music.hold(st.id==='match')}catch(e){}
  stage.replaceChildren(el);
  chrome();
}
function go(to){
  if(ui.busy||to<0||to>=STEPS.length||to===state.step) return;
  if(to>state.step){ const st=STEPS[state.step]; if(st.ok&&!st.ok()) return; }
  const dir=to>state.step?1:-1;
  state.step=to; state.max=Math.max(state.max,to); paint(dir);
}
btnNext.addEventListener('click',()=>{
  if(ui.busy) return;
  const st=STEPS[state.step];
  if(st.action&&st.action()) return;
  go(state.step+1);
});
btnBack.addEventListener('click',()=>go(state.step-1));
btnFwd.addEventListener('click',()=>go(state.step+1));
addEventListener('keydown',e=>{
  if(e.target.matches&&e.target.matches('input,textarea')) return;
  if(e.key==='ArrowLeft') go(state.step+1);
  if(e.key==='ArrowRight') go(state.step-1);
});

/* ================= تنظیمات ================= */
const sheet=$('#sheet'), sw=$('#swMusic');
const syncSw=()=>sw.setAttribute('aria-checked',String(Music.on()));
function openSheet(){ sheet.hidden=false; requestAnimationFrame(()=>requestAnimationFrame(()=>sheet.classList.add('open'))); }
function closeSheet(){ sheet.classList.remove('open'); setTimeout(()=>{sheet.hidden=true},240); }
$('#btnSettings').addEventListener('click',openSheet);
sheet.addEventListener('click',e=>{ if(e.target.closest('[data-close]')) closeSheet(); });
sw.addEventListener('click',()=>{ Music.set(!Music.on()); syncSw(); });
syncSw();
const swA=$('#swArena');
swA.addEventListener('click',()=>{ Arena.set(!Arena.on()); swA.setAttribute('aria-checked',String(Arena.on())); if(Arena.on()&&mtEl&&MT&&MT.phase!=='final') Arena.crowd(); });

// مرورگرها اجازه‌ی پخش صدا رو فقط بعد از اولین لمس می‌دن
const UNLOCK=['click','touchend','pointerup','keydown'];
function onGesture(){
  try{Music.start()}catch(e){} try{Arena.unlock()}catch(e){}
  setTimeout(()=>{ if(Music.playing()) UNLOCK.forEach(e=>removeEventListener(e,onGesture,true)); },500);
}
UNLOCK.forEach(e=>addEventListener(e,onGesture,true));

paint(0);
})();
</script>
