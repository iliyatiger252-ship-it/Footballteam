<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<meta name="color-scheme" content="dark">
<title>دربی رویایی</title>
<style>
:root{
  --bg0:#05070d; --bg1:#0b1020; --bg2:#141b33;
  --gold:#f6c453; --ember:#ff6a2b; --ember2:#ffb347;
  --text:#f4f1ea; --muted:#98a2bf;
  --glass:rgba(255,255,255,.06); --glass-b:rgba(255,255,255,.13);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg0);color:var(--text);overflow:hidden;
  font-family:"Vazirmatn","IRANSans",Tahoma,system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

/* ---------- پس‌زمینه ---------- */
#bg{position:fixed;inset:0;z-index:0;overflow:hidden;
  background:
    radial-gradient(70% 38% at 50% 112%, rgba(255,106,43,.22), transparent 70%),
    radial-gradient(90% 46% at 50% -12%, rgba(70,110,255,.20), transparent 70%),
    linear-gradient(180deg,var(--bg1),var(--bg0))}
#bg::before{content:"";position:absolute;left:50%;bottom:-62vmax;width:124vmax;height:124vmax;transform:translateX(-50%);
  border:2px solid rgba(255,255,255,.05);border-radius:50%}
#bg::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(255,255,255,.04)}
.beam{position:absolute;top:-10%;width:46vmax;height:130%;opacity:.55;filter:blur(2px);
  background:linear-gradient(180deg,rgba(150,180,255,.16),transparent 70%);transform-origin:top center}
.beam.l{left:-18vmax;transform:rotate(-16deg);animation:sway 9s ease-in-out infinite alternate}
.beam.r{right:-18vmax;transform:rotate(16deg);animation:sway 11s ease-in-out infinite alternate-reverse}
@keyframes sway{from{opacity:.35}to{opacity:.7}}
#embers{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}

/* ---------- قاب برنامه ---------- */
#app{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;height:100dvh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px 4px;
  width:100%;max-width:560px;margin:0 auto}
.navg{display:flex;gap:8px}
.icon{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;
  background:var(--glass);border:1px solid var(--glass-b);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  transition:transform .15s,background .2s,opacity .2s}
.icon:active{transform:scale(.92)}
.icon:disabled{opacity:.3;pointer-events:none}
.icon svg{width:22px;height:22px;stroke:var(--text);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#stepLabel{flex:1;text-align:center;line-height:1.25}
#stepLabel b{display:block;font-size:15px;font-weight:700}
#stepLabel small{color:var(--muted);font-size:12px}
.dots{display:flex;justify-content:center;gap:7px;padding:6px 0 2px}
.dots i{width:7px;height:7px;border-radius:99px;background:rgba(255,255,255,.16);transition:all .3s}
.dots i.seen{background:rgba(255,179,71,.55)}
.dots i.on{width:24px;background:linear-gradient(90deg,var(--ember),var(--gold));box-shadow:0 0 12px rgba(255,106,43,.7)}

#stage{position:relative;flex:1;width:100%;max-width:560px;margin:0 auto;min-height:0}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:8px 20px;text-align:center;overflow-y:auto}
.screen.top{justify-content:flex-start;padding-top:10px;padding-bottom:14px}
.in-fwd{animation:inFwd .38s cubic-bezier(.2,.8,.2,1) both}
.in-back{animation:inBack .38s cubic-bezier(.2,.8,.2,1) both}
.in-first{animation:inFirst .7s ease both}
@keyframes inFwd{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
@keyframes inBack{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes inFirst{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

#foot{width:100%;max-width:560px;margin:0 auto;padding:10px 20px 18px}
.cta{position:relative;width:100%;height:56px;border-radius:18px;font-size:18px;font-weight:800;color:#1a0d05;overflow:hidden;
  background:linear-gradient(135deg,var(--ember2),var(--ember) 55%,#ff3d1f);
  box-shadow:0 8px 28px rgba(255,106,43,.42),inset 0 1px 0 rgba(255,255,255,.45);
  transition:transform .15s,filter .2s,opacity .2s}
.cta:active{transform:scale(.97)}
.cta:disabled{opacity:.4;filter:grayscale(.5);pointer-events:none;font-size:15px}
.cta::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);
  animation:sheen 4.2s ease-in-out infinite}
@keyframes sheen{0%,55%{left:-60%}100%{left:130%}}

/* ---------- صفحه‌ی خوش‌آمد ---------- */
.hero{position:relative;width:min(46vw,176px);aspect-ratio:1;margin-bottom:30px;animation:float 3s ease-in-out infinite}
.hero::before{content:"";position:absolute;inset:-34%;border-radius:50%;
  background:radial-gradient(circle,rgba(255,106,43,.5),rgba(255,106,43,.12) 45%,transparent 70%);animation:pulse 2.6s ease-in-out infinite}
.hero::after{content:"";position:absolute;left:12%;right:12%;bottom:-20px;height:16px;border-radius:50%;
  background:radial-gradient(ellipse,rgba(0,0,0,.55),transparent 70%);animation:shadow 3s ease-in-out infinite}
.ball{position:relative;width:100%;height:100%;animation:spin 22s linear infinite;filter:drop-shadow(0 6px 14px rgba(0,0,0,.5))}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes shadow{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(.78);opacity:.55}}
@keyframes pulse{0%,100%{opacity:.75;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
@keyframes spin{to{transform:rotate(360deg)}}
.title{margin:6px 0 8px;font-size:clamp(38px,12vw,58px);font-weight:900;line-height:1.1;
  background:linear-gradient(180deg,#fff2c9,var(--gold) 50%,var(--ember));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 18px rgba(255,150,60,.45));animation:glow 3.2s ease-in-out infinite}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 12px rgba(255,150,60,.3))}50%{filter:drop-shadow(0 0 26px rgba(255,150,60,.65))}}
.sub{margin:0 0 22px;color:var(--muted);font-size:15px;line-height:1.8}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{padding:7px 14px;border-radius:99px;font-size:13px;background:var(--glass);border:1px solid var(--glass-b);color:#dfe4f4;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}

/* ---------- کارت موقت ---------- */
.card{width:100%;padding:34px 22px;border-radius:26px;background:var(--glass);border:1px solid var(--glass-b);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 14px 40px rgba(0,0,0,.35)}
.num{font-size:64px;font-weight:900;line-height:1;margin-bottom:10px;
  background:linear-gradient(180deg,var(--ember2),var(--ember));-webkit-background-clip:text;background-clip:text;color:transparent}
.card h2{margin:0 0 8px;font-size:22px}
.card p{margin:0;color:var(--muted);line-height:1.9;font-size:15px}
.soon{display:inline-block;margin-top:16px;padding:6px 14px;border-radius:99px;font-size:12px;color:var(--gold);
  border:1px dashed rgba(246,196,83,.5)}

/* ---------- مرحله ۲: اسم و رنگ ---------- */
.tcard{width:100%;padding:14px;border-radius:20px;background:var(--glass);border:1px solid var(--glass-b);text-align:right;margin-bottom:12px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.thead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.tag{font-weight:800;font-size:15px}
.tcol{margin-inline-start:auto;font-size:12.5px;color:var(--muted)}
.jersey{width:34px;height:34px;flex:none}
.jersey path{fill:var(--jc,#3a4160);stroke:rgba(255,255,255,.45);stroke-width:2;stroke-linejoin:round;transition:fill .25s}
.tin{width:100%;height:48px;border-radius:14px;border:1px solid var(--glass-b);background:rgba(0,0,0,.28);color:var(--text);
  font:inherit;font-size:17px;padding:0 14px;outline:0;transition:border-color .2s,box-shadow .2s}
.tin::placeholder{color:#6f7894}
.tin:focus{border-color:var(--ember2);box-shadow:0 0 0 3px rgba(255,106,43,.22)}
.tin.bad{border-color:#ff5a5a}
.err{min-height:18px;margin:5px 4px 0;font-size:12.5px;color:#ff8a8a}
.sws{display:flex;gap:14px;margin-top:6px}
.sw{width:44px;height:44px;border-radius:50%;background:var(--c);border:2px solid rgba(255,255,255,.3);transition:transform .15s,box-shadow .2s,opacity .2s}
.sw.sel{border-color:var(--gold);box-shadow:0 0 0 3px rgba(246,196,83,.35),0 0 16px rgba(246,196,83,.5);transform:scale(1.1)}
.sw:disabled{opacity:.2;pointer-events:none}
.sw:active{transform:scale(.92)}

/* ---------- مرحله ۲: ترکیب ---------- */
.mini{margin:0 0 10px;color:var(--muted);font-size:13.5px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;margin-bottom:12px}
.segb{min-width:0;padding:10px 8px;border-radius:16px;background:var(--glass);border:1px solid var(--glass-b);
  display:flex;flex-direction:column;align-items:center;gap:3px;transition:all .2s}
.segb.on{border-color:var(--ember2);background:rgba(255,106,43,.14);box-shadow:0 0 18px rgba(255,106,43,.25)}
.segb b{max-width:100%;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.segb small{font-size:12px;color:var(--muted)}
.segb .jersey{width:26px;height:26px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:100%}
.fm{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:16px;background:var(--glass);border:1px solid var(--glass-b);
  transition:all .2s;text-align:right}
.fm:active{transform:scale(.96)}
.fm.sel{border-color:var(--gold);background:rgba(246,196,83,.12);box-shadow:0 0 16px rgba(246,196,83,.3)}
.fm svg{width:44px;height:58px;flex:none;border-radius:8px}
.fm b{font-size:18px}

/* ---------- مرحله ۲: سکه ---------- */
.vs{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-bottom:4px;font-size:15px}
.vs span{display:flex;align-items:center;gap:7px;min-width:0;max-width:42%;font-weight:800}
.vs em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vs b{color:var(--muted);font-weight:500;font-size:13px}
.dot{width:13px;height:13px;border-radius:50%;background:var(--c);border:1px solid rgba(255,255,255,.5);flex:none}
.toss{position:relative;height:300px;width:100%;display:grid;place-items:center;perspective:700px;cursor:pointer}
.toss::before{content:"";position:absolute;left:50%;top:50%;width:280px;height:280px;margin:-140px;border-radius:50%;
  background:radial-gradient(circle,var(--wc,transparent),transparent 65%);opacity:0;transition:opacity .7s;pointer-events:none}
.toss.won::before{opacity:.42}
.cshadow{position:absolute;left:50%;top:calc(50% + 90px);width:130px;height:22px;margin-left:-65px;border-radius:50%;
  background:radial-gradient(ellipse,rgba(0,0,0,.65),transparent 70%);will-change:transform,opacity}
.hop{position:relative;z-index:1;width:150px;height:150px;transform-style:preserve-3d;will-change:transform}
.coin{position:relative;width:100%;height:100%;transform-style:preserve-3d;will-change:transform}
.edge{position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(#7d500c 0 4deg,#d9a23a 4deg 8deg)}
.face{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;filter:brightness(var(--b,1));
  background:repeating-conic-gradient(#f3c75a 0 3deg,#b07a18 3deg 6deg);box-shadow:0 0 0 1px #6b4509}
.face.f{transform:translateZ(6px)}
.face.b{transform:rotateX(180deg) translateZ(6px)}
.face .in{position:absolute;inset:7px;border-radius:50%;
  background:radial-gradient(circle at 35% 28%,#fff6cf,#f6c453 42%,#c8901f 78%,#9a6a12);
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.35),inset 0 0 0 9px var(--c),inset 0 0 0 11px rgba(0,0,0,.28),inset 0 -8px 16px rgba(0,0,0,.25)}
.face .star{position:absolute;top:24px;left:0;right:0;text-align:center;color:#8a5a10;font-size:10px;letter-spacing:2px;font-style:normal}
.face .lbl{position:relative;max-width:96px;color:#3a2504;font-weight:900;font-size:17px;line-height:1.3;text-align:center;word-break:break-word;
  text-shadow:0 1px 0 rgba(255,255,255,.6),0 -1px 0 rgba(0,0,0,.22)}
.face .shine{position:absolute;inset:7px;border-radius:50%;pointer-events:none;
  background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.5) 44%,transparent 56%)}
.spark{position:absolute;z-index:3;left:50%;top:50%;width:7px;height:7px;margin:-3.5px;border-radius:50%;pointer-events:none;
  background:var(--sc);box-shadow:0 0 8px var(--sc),0 0 16px var(--sc);animation:spark .85s cubic-bezier(.1,.7,.3,1) both}
@keyframes spark{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(.15);opacity:0}}
.ring{position:absolute;z-index:2;left:50%;top:50%;width:150px;height:150px;margin:-75px;border-radius:50%;pointer-events:none;
  border:3px solid var(--sc);box-shadow:0 0 18px var(--sc);animation:ring .75s ease-out both}
@keyframes ring{from{transform:scale(.85);opacity:.95}to{transform:scale(1.9);opacity:0}}
.coinres{min-height:84px;width:100%}
.coinres .big{font-size:20px;font-weight:900;color:var(--gold);margin-bottom:6px}
.coinres p{margin:0;color:var(--muted);font-size:14.5px;line-height:1.8}
.coinres p b{color:var(--text)}
.pop{animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}

/* ---------- مرحله ۳: انتخاب بازیکن ---------- */
.screen.dr{justify-content:flex-start;align-items:stretch;gap:8px;padding:6px 10px;overflow:hidden;text-align:right}
.dtop{display:flex;flex-direction:column;gap:8px;flex:1;min-height:0}
.turn{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:16px;background:var(--glass);border:1px solid var(--glass-b)}
.turn .jersey{width:30px;height:30px}
.turn .t1{font-weight:800;font-size:14px;line-height:1.3}
.turn small{color:var(--gold);font-size:12.5px;font-weight:700}
.turn .cnt{margin-inline-start:auto;font-size:12px;color:var(--muted)}
.undo{width:36px;height:36px;flex:none}
.pitch{position:relative;flex:1;min-height:0;border-radius:18px;overflow:hidden;border:1px solid rgba(255,255,255,.18);
  background:repeating-linear-gradient(180deg,#10412a 0 12.5%,#0d3523 12.5% 25%);box-shadow:inset 0 0 30px rgba(0,0,0,.35)}
.pl{position:absolute;inset:0;width:100%;height:100%}
.pl *{vector-effect:non-scaling-stroke}
.slot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;width:70px;pointer-events:none}
.slot .jersey{width:30px;height:30px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
.slot .ph{width:30px;height:30px;border-radius:50%;border:2px dashed rgba(255,255,255,.4);display:grid;place-items:center;
  font-size:9px;font-weight:800;color:rgba(255,255,255,.75);direction:ltr;background:rgba(0,0,0,.2)}
.slot .nm{font-size:10px;font-weight:800;max-width:70px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;direction:ltr;
  text-shadow:0 1px 3px #000,0 0 6px #000}
.slot.cur .ph{border-color:var(--gold);color:var(--gold);animation:curp 1.2s ease-in-out infinite}
.slot.prev .jersey{animation:curp 1.2s ease-in-out infinite}
@keyframes curp{0%,100%{box-shadow:0 0 0 0 rgba(246,196,83,.7)}50%{box-shadow:0 0 0 8px rgba(246,196,83,0)}}
.slot.bad .jersey{--jc:#d92d3a!important;outline:2px solid #ff3b4a;outline-offset:3px;border-radius:50%;box-shadow:0 0 12px 2px rgba(255,59,74,.75)}
.slot.bad .nm{color:#ff8f8f}
.slot.bad::after{content:"پست اشتباه";font-size:8.5px;font-weight:800;color:#fff;background:#d92d3a;border-radius:6px;padding:0 5px;margin-top:1px}
.dtwo{display:flex;flex-direction:column;gap:8px;flex:1;min-height:0}
.dhalf{flex:1;display:flex;flex-direction:column;min-height:0;gap:4px}
.tcap{display:flex;align-items:center;gap:8px;font-size:13px}
.tcap .jersey{width:22px;height:22px}
.tcap small{color:var(--muted);margin-inline-start:auto;direction:ltr}
.dfind{flex:none}
.dfind .tin{height:42px;font-size:15px}
.strip{flex:none;display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;padding:4px 2px 8px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.strip::-webkit-scrollbar{height:4px}
.strip::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:9px}
.pc{flex:none;width:106px;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 6px;border-radius:16px;
  background:var(--glass);border:1.5px solid var(--glass-b);transition:transform .18s,border-color .18s,background .18s,box-shadow .18s}
.pc:active{transform:scale(.96)}
.pc .jersey{width:38px;height:38px}
.pc .en{font-size:13px;font-weight:800;line-height:1.2;direction:ltr;text-align:center;min-height:31px;display:flex;align-items:center;justify-content:center}
.pc .fa{font-size:10.5px;color:var(--muted);line-height:1.25;text-align:center;min-height:26px;display:flex;align-items:center;justify-content:center}
.pp{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;direction:ltr;min-height:21px}
.pp i{font-style:normal;font-size:9.5px;font-weight:800;padding:2px 5px;border-radius:6px;color:var(--pc);border:1px solid var(--pc);background:rgba(0,0,0,.25)}
.pp i.fit{background:var(--pc);color:#101420}
.pp i.eq{border-style:dashed;background:rgba(52,211,153,.14)}
.pp i.no{opacity:.55}
.pc.bad{border-color:rgba(255,107,107,.35)}
.pc.bad.sel{border-color:var(--gold)}
.pc.sel{border-color:var(--gold);background:rgba(246,196,83,.15);box-shadow:0 0 18px rgba(246,196,83,.35);transform:translateY(-3px)}
.pc.off{opacity:.3;pointer-events:none;filter:grayscale(.7)}
/* --- چیدمان فشرده: زمین همیشه عمودی و با نسبت واقعی --- */
.screen.dr{gap:6px;padding:4px 10px;overflow-y:auto}
.turn{flex:none;padding:5px 6px 5px 8px;gap:8px;border-radius:14px}
.turn .jersey{width:24px;height:24px;flex:none}
.turn .tx{min-width:0;flex:0 1 auto;max-width:44%}
.turn .t1{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.turn small{display:block;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.turn .cn{font-size:10.5px;font-weight:500;color:var(--muted)}
.turn .tin{flex:1;min-width:0;height:34px;font-size:13.5px;padding:0 10px;border-radius:11px}
.undo{width:32px;height:32px}
.undo svg{width:18px;height:18px}
.pwrap{flex:1;min-height:250px;display:flex;align-items:center;justify-content:center;container-type:size}
.pitch{flex:none;width:min(100cqw,100cqh / 1.3);height:min(100cqh,100cqw * 1.3);container-type:size}
.slot{width:22cqw;gap:1px}
.slot .jersey,.slot .ph{width:clamp(22px,10.5cqw,34px);height:clamp(22px,10.5cqw,34px)}
.slot .ph{font-size:clamp(7.5px,2.9cqw,10px)}
.slot .nm{font-size:clamp(8px,3.4cqw,11px);max-width:22cqw}
.slot.bad::after{font-size:clamp(7px,2.6cqw,9px)}
.dtwo{flex-direction:row;gap:8px}
.dhalf{min-width:0}
.tcap{font-size:12px;gap:6px;min-width:0}
.tcap b{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip{gap:7px;padding:2px 2px 5px}
.pc{width:104px;gap:2px;padding:6px 5px 7px;border-radius:14px}
.pc .jersey{width:26px;height:26px}
.pc .en{font-size:12.5px;line-height:1.15;min-height:29px}
.pc .fa{display:block;font-size:10px;min-height:0;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pp{min-height:19px}
.pp i{font-size:9px;padding:1px 4px}

body[data-step="draft"] .dots{display:none}
body[data-step="draft"] #foot{padding:6px 12px 10px}
body[data-step="draft"] .cta{height:48px;font-size:16px;border-radius:15px}

/* --- مربی، داور، زننده‌ها --- */
.bust{width:30px;height:30px;flex:none}
.turn .bust{width:26px;height:26px}
.pc .bust{width:30px;height:30px}
.tcap .jersey{width:20px;height:20px}
.cbar .bust{width:20px;height:20px}
.cbar{flex:none;display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:700;direction:ltr}
.jw{position:relative;display:block;line-height:0}
.bd{position:absolute;top:-6px;right:-8px;min-width:15px;height:15px;padding:0 3px;border-radius:99px;display:grid;place-items:center;
  background:var(--gold);color:#241500;font-size:9px;font-weight:900;line-height:1;box-shadow:0 0 0 2px rgba(10,30,20,.9)}
.bd.sb{background:#7dd3fc}
.bd+.bd{right:auto;left:-8px}
.slot.tkp .jersey{outline:2px solid var(--gold);outline-offset:3px;border-radius:50%;animation:curp 1.2s ease-in-out infinite}
.stagec{width:100%;height:100%;max-height:380px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  border-radius:20px;background:var(--glass);border:1px solid var(--glass-b);padding:12px;text-align:center}
.stagec .bust{width:clamp(70px,34cqw,130px);height:auto;aspect-ratio:1;filter:drop-shadow(0 6px 14px rgba(0,0,0,.5))}
.stagec .sh{font-size:17px;font-weight:900}
.stagec small{color:var(--muted);font-size:12.5px}
.stagec .sel{margin-top:8px;min-height:58px;display:flex;flex-direction:column;align-items:center;gap:2px}
.stagec .sel b{font-size:22px;font-weight:900;direction:ltr}
.stagec .sel span{font-size:13px;color:var(--muted)}
.stagec .sel.q{font-size:40px;color:rgba(255,255,255,.25);font-weight:900;justify-content:center}
.dwrap{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px;width:100%}
.dwrap .dtwo{flex:1;min-height:0}
.dhalf{flex:1}
.refbar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 6px 4px 12px;border-radius:14px;background:var(--glass);border:1px solid var(--glass-b);font-size:13px}
.refbar b{direction:ltr;unicode-bidi:isolate}
.cta{padding:0 12px;white-space:nowrap;text-overflow:ellipsis}

.slot{width:var(--nw,22cqw)}
.slot .nm{max-width:100%}
.slot .nm.lg{font-size:clamp(7px,2.7cqw,8.6px);letter-spacing:-.15px}
.slot .nm.xl{font-size:clamp(6.5px,2.3cqw,7.4px);letter-spacing:-.2px}
.tabs{flex:none;display:flex;gap:8px}
.tab{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:6px;padding:6px 8px;border-radius:12px;background:var(--glass);border:1px solid var(--glass-b);font-size:12.5px;transition:all .2s}
.tab.on{border-color:var(--gold);background:rgba(246,196,83,.12)}
.tab b{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tab small{color:var(--muted);direction:ltr;font-size:11px}
.tab .jersey{width:20px;height:20px;flex:none}
[hidden]{display:none!important}
.nores{padding:18px 8px;color:var(--muted);font-size:14px;width:100%;text-align:center}

/* ---------- تنظیمات ---------- */
.sheet{position:fixed;inset:0;z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;transition:opacity .22s}
.panel{position:relative;width:100%;max-width:560px;padding:12px 22px calc(22px + env(safe-area-inset-bottom));
  border-radius:26px 26px 0 0;background:linear-gradient(180deg,#171f3a,#0d1226);border:1px solid var(--glass-b);border-bottom:0;
  transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.sheet.open .backdrop{opacity:1}
.sheet.open .panel{transform:none}
.grab{width:44px;height:5px;border-radius:99px;background:rgba(255,255,255,.2);margin:0 auto 14px}
.panel h2{margin:0 0 14px;font-size:19px}
.row{display:flex;align-items:center;justify-content:space-between;padding:14px 4px;border-top:1px solid rgba(255,255,255,.08);font-size:16px}
.switch{position:relative;width:54px;height:32px;border-radius:99px;background:rgba(255,255,255,.18);transition:background .25s}
.switch i{position:absolute;top:3px;right:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .25s;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.switch[aria-checked="true"]{background:linear-gradient(135deg,var(--ember2),var(--ember))}
.switch[aria-checked="true"] i{transform:translateX(-22px)}
.ghost{width:100%;margin-top:10px;height:48px;border-radius:14px;background:var(--glass);border:1px solid var(--glass-b);font-size:16px}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}
}

/* ================= مرحله‌ی بازی ================= */
body[data-step="match"] #foot{display:none}
body[data-step="match"] #dots{display:none}
.screen.mt{justify-content:flex-start;align-items:stretch;gap:8px;padding:4px 10px 10px;overflow:hidden;text-align:right}
.sb{position:relative;flex:none;border-radius:16px;overflow:hidden;
  background:linear-gradient(180deg,rgba(24,31,58,.97),rgba(8,11,22,.97));border:1px solid rgba(255,255,255,.16);
  box-shadow:0 8px 24px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.12);transition:box-shadow .4s}
.sb::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--c0) 50%,var(--c1) 50%)}

.sbl{display:flex;align-items:center;justify-content:space-between;padding:9px 12px 0;font-size:11px;color:var(--muted)}
.live{display:flex;align-items:center;gap:5px;color:#ff6464;font-weight:800}
.live i{width:7px;height:7px;border-radius:50%;background:#ff4040;box-shadow:0 0 8px #ff4040;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
.clk{direction:ltr;unicode-bidi:isolate;font-family:system-ui,Arial,sans-serif;font-size:15px;color:var(--gold);font-weight:900;letter-spacing:.5px;text-shadow:0 0 12px rgba(246,196,83,.5)}
.sbp{font-weight:700}
.sbm{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;padding:5px 10px 9px}
.sbt{display:flex;align-items:center;gap:7px;min-width:0;font-weight:800;font-size:13.5px}
.sbt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbt.t1{justify-content:flex-end}
.sbc{flex:none;display:inline-block;width:16px;height:20px;border-radius:5px 5px 7px 7px;background:var(--tc);border:1px solid rgba(255,255,255,.55);box-shadow:0 0 8px rgba(0,0,0,.4)}
.sbs,.bks{display:flex;align-items:center;gap:5px}
.sbs b,.bks b{min-width:34px;height:44px;padding:0 4px;border-radius:10px;background:#04060c;border:1px solid rgba(255,255,255,.2);
  display:grid;place-items:center;font-size:26px;font-weight:900;color:#fff;font-family:system-ui,Arial,sans-serif;box-shadow:inset 0 0 10px rgba(255,255,255,.07)}
.sbs em,.bks em{font-style:normal;color:var(--gold);font-weight:900;font-size:20px}
.sbs b.pop{animation:spop .9s ease}
@keyframes spop{0%{transform:scale(1)}25%{transform:scale(1.5);color:var(--gold);box-shadow:0 0 22px var(--gold)}100%{transform:scale(1)}}
.sbpk{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 14px 8px;font-size:12px;font-weight:800;color:var(--gold)}
.sbpk b{font-size:18px;color:#fff;font-family:system-ui,Arial,sans-serif}.sbpk b:first-child{justify-self:start}.sbpk b:last-child{justify-self:end}
.fpk{display:grid;grid-template-columns:auto auto auto;gap:10px;align-items:center;font-size:13px;color:var(--gold);font-weight:800}
.fpk b{font-size:20px;color:#fff;font-family:system-ui,Arial,sans-serif}
.rpb.sc{-webkit-mask-image:linear-gradient(180deg,#000 calc(100% - 34px),transparent);mask-image:linear-gradient(180deg,#000 calc(100% - 34px),transparent)}
.sbpk[hidden]{display:none}
.mv{position:relative;flex:1;min-height:0}
.v{position:absolute;inset:0;display:flex;flex-direction:column;gap:8px;animation:vin .38s ease both;min-height:0}
@keyframes vin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* شمارش */
.v.cnt{align-items:center;justify-content:center;text-align:center;gap:14px}
.cn-vs{display:flex;align-items:center;justify-content:center;gap:14px;width:100%}
.cn-t{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;min-width:0}
.cn-t b{font-size:15px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cn-t small{color:var(--muted);font-size:12px}
.cn-j{width:62px;height:62px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.5))}
.cn-j .jersey{width:100%;height:100%}
.cn-x{font-weight:900;font-size:20px;color:var(--gold)}
.cnum{height:110px;display:grid;place-items:center;font-size:92px;font-weight:900;color:var(--gold);text-shadow:0 0 34px rgba(246,196,83,.75)}
.cnum.pop{animation:cpop .9s ease both}
.cnum.go{font-size:56px;color:var(--ember2);text-shadow:0 0 34px rgba(255,106,43,.9)}
@keyframes cpop{0%{transform:scale(2.2);opacity:0}25%{transform:scale(1);opacity:1}80%{opacity:1}100%{transform:scale(.85);opacity:.2}}
.cn-r{color:var(--muted);font-size:12.5px}
/* توپ چرخان */
.v.bv{align-items:center;justify-content:center;text-align:center;gap:12px}
.bring{position:relative;width:176px;height:176px;display:grid;place-items:center}
.bring::before{content:"";position:absolute;inset:6px;border-radius:50%;filter:blur(16px);opacity:.6;
  background:conic-gradient(var(--c0,#ff6a2b),transparent 28%,var(--c1,#5aa7ff) 50%,transparent 78%,var(--c0,#ff6a2b));animation:bspin 3.4s linear infinite}
.bring svg{position:relative;width:112px;height:112px;animation:bspin 1.25s linear infinite;filter:drop-shadow(0 10px 14px rgba(0,0,0,.55))}
@keyframes bspin{to{transform:rotate(360deg)}}
.bsh{width:90px;height:10px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.55),transparent);animation:bsh 1.25s ease-in-out infinite}
@keyframes bsh{50%{transform:scaleX(.7);opacity:.6}}
.btx{color:var(--muted);font-size:14px;min-height:22px;transition:opacity .22s}
/* گزارش */
.v.rp{gap:8px}
.rph{flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 4px}
.rpm{display:flex;align-items:baseline;gap:6px;font-size:30px;font-weight:900;color:var(--gold);text-shadow:0 0 16px rgba(246,196,83,.4)}
.rpm small{font-size:13px;color:var(--muted);font-weight:700}
.rpt{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:800;padding:5px 10px;border-radius:99px;background:var(--glass);border:1px solid var(--glass-b)}
.rpb{flex:1;min-height:0;overflow-y:auto;padding:12px 14px 4px;border-radius:16px;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.04));border:1px solid var(--glass-b);
  font-size:14.5px;line-height:2;color:#efeadd;overscroll-behavior:contain}
.rpb p{margin:0 0 12px}
.rpb p span,.pkt span{display:block;animation:rise .5s ease both}
.rpb p:last-child{color:#ffd9a0}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.cta.rd,.v .cta{flex:none;height:50px;font-size:17px}
/* اعلام گل */
.gbn{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;
  background:radial-gradient(70% 55% at 50% 50%,rgba(0,0,0,.2),rgba(4,6,12,.9));animation:gin 3.1s ease both;border-radius:18px}
.gbn b{font-size:48px;font-weight:900;color:var(--gold);text-shadow:0 0 36px rgba(246,196,83,.9),0 0 8px #000;animation:gz .7s ease both}
.gbn strong{font-size:24px;color:#fff;text-shadow:0 0 18px var(--tc)}
.gbn span{font-size:14px;color:var(--ember2)}
.gbn.no b{font-size:34px;color:#cfd6ea;text-shadow:0 0 20px rgba(150,170,220,.6)}
@keyframes gin{0%{opacity:0}12%{opacity:1}85%{opacity:1}100%{opacity:0}}
@keyframes gz{0%{transform:scale(.3) rotate(-6deg)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
/* استراحت */
.v.brk{gap:8px}
.bk{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;gap:10px;padding:6px 4px;text-align:center}
.bk h2{margin:0;font-size:21px;color:var(--gold)}
.bk p{margin:0;color:var(--muted);font-size:13.5px}
.gls{display:flex;gap:10px;width:100%;justify-content:space-between;align-items:flex-start}
.glc{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;font-size:12.5px;text-align:right;padding:8px 10px;border-radius:12px;background:var(--glass);border:1px solid var(--glass-b)}
.glc b{display:flex;align-items:center;gap:6px;font-size:13px;margin-bottom:2px}
.glc span.mu{color:var(--muted)}
.gl0{width:100%;color:var(--muted);font-size:13px;padding:8px}
.sts{width:100%;display:flex;flex-direction:column;gap:9px}
.st{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;row-gap:3px;font-size:12.5px}
.st b{font-size:14px}.st b:last-of-type{text-align:left}
.st span{text-align:center;color:var(--muted)}
.stb{grid-column:1/-1;display:flex;height:5px;border-radius:9px;overflow:hidden;background:rgba(255,255,255,.08);gap:2px}
.stb i{display:block;height:100%}
/* پنالتی */
.v.pki{align-items:center;justify-content:center;text-align:center}
.pk0{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:0 8px}
.pk0t{font-size:26px;font-weight:900;color:var(--gold)}
.pk0 p{margin:0;line-height:2;font-size:14.5px;color:#efeadd}
.v.pkv{gap:8px}
.pktr{flex:none;display:flex;flex-direction:column;gap:6px;padding:8px 10px;border-radius:14px;background:var(--glass);border:1px solid var(--glass-b)}
.pkr{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pkn{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:800;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:40%}
.pkd{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.pkd i{width:20px;height:20px;border-radius:50%;border:2px solid rgba(255,255,255,.25);display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:900}
.pkd i.g{background:#2fbf71;border-color:#2fbf71;color:#04170c}
.pkd i.x{background:#e5484d;border-color:#e5484d;color:#fff}
.pkd i.cur{border-color:var(--gold);box-shadow:0 0 10px var(--gold);animation:blink 1s infinite}
.pkc{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:10px 14px;border-radius:16px;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.03));border:1px solid var(--glass-b);overflow:hidden}
.pkl{font-size:12.5px;color:var(--muted)}
.pkp{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:900}
.pkp .jersey{width:42px;height:42px}
.pkk{font-size:13px;color:var(--muted)}
.pkcr{font-size:13px;font-weight:800;color:var(--ember2);animation:blink 1.1s infinite}
.pkball{width:56px;height:56px;margin-top:6px;transition:transform .9s cubic-bezier(.2,.7,.3,1),opacity .9s}
.pkball svg{width:100%;height:100%}
.pkball.fly{transform:translateY(-60px) scale(.35) rotate(540deg);opacity:.2}
.pkc.res .pkbadge{font-size:26px;font-weight:900;padding:4px 20px;border-radius:99px;animation:gz .6s ease both}
.pkc.res.goal .pkbadge{background:#2fbf71;color:#04170c;box-shadow:0 0 24px #2fbf71}
.pkc.res.save .pkbadge,.pkc.res.miss .pkbadge,.pkc.res.post .pkbadge{background:#e5484d;color:#fff;box-shadow:0 0 24px #e5484d}
.pkt{margin:0;line-height:1.95;font-size:14px;color:#efeadd;animation:rise .5s ease both}
/* پایان */
.v.fin{overflow:hidden}
.fsc{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;gap:10px;padding:4px 2px 10px;text-align:center;position:relative;z-index:1}
.fcup{font-size:46px;animation:gz .8s ease both;filter:drop-shadow(0 0 18px rgba(246,196,83,.8))}
.fttl{font-size:13px;color:var(--muted);letter-spacing:.5px}
.fwin{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:900;color:#fff;text-shadow:0 0 22px var(--tc)}
.fpk{font-size:13px;color:var(--gold);font-weight:800}
.mom{width:100%;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;text-align:right;background:linear-gradient(135deg,rgba(246,196,83,.18),rgba(255,106,43,.1));border:1px solid rgba(246,196,83,.4)}
.momj{width:44px;height:44px;flex:none}.momj .jersey{width:100%;height:100%}
.mom small{display:block;color:var(--gold);font-size:11.5px}
.mom b{display:block;font-size:17px}
.mom span{font-size:12.5px;color:var(--muted)}
.fbt{width:100%;display:flex;flex-direction:column;gap:8px;margin-top:4px}
.fbt .ghost{height:44px;border-radius:14px;background:var(--glass);border:1px solid var(--glass-b);font-size:14px;font-weight:700}
.conf{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:2}
.conf i{position:absolute;top:-12px;width:7px;height:12px;border-radius:2px;opacity:.9;animation:cf var(--t) linear var(--d) infinite}
@keyframes cf{to{transform:translateY(560px) rotate(720deg);opacity:.2}}

  .cnum{height:90px;font-size:76px}
  .bring{width:150px;height:150px}.bring svg{width:96px;height:96px}
  .rpb{font-size:14px;line-height:1.9}
}
@media (prefers-reduced-motion:reduce){
  .bring svg,.bring::before,.bsh,.live i,.pkcr,.conf i{animation:none}
}

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const FA='۰۱۲۳۴۵۶۷۸۹';
const fa=n=>String(n).replace(/\d/g,d=>FA[+d]);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ================= آهنگ (ساخته‌شده با Web Audio، بدون فایل و بدون کپی‌رایت) ================= */
const Music=(()=>{
  const KEY='dd_music';
  let ctx=null,master=null,noise=null,timer=null,step=0,nextT=0,started=false,enabled=true,held=false;
  try{enabled=localStorage.getItem(KEY)!=='0'}catch(e){}
  const BPM=112,EIGHTH=60/BPM/2,LOOP=64,VOL=.5;
  const hz=m=>440*Math.pow(2,(m-69)/12);
  // آکورد هر میزان: [باس, [پد]]  (Am F C G Am F G E)
  const CH=[[45,[57,60,64]],[41,[53,57,60]],[48,[55,60,64]],[43,[55,59,62]],[45,[57,60,64]],[41,[53,57,60]],[43,[55,59,62]],[40,[56,59,64]]];
  const MEL=[
    [76,0,76,74,72,0,74,76],
    [77,0,77,76,74,0,72,0],
    [72,0,76,79,0,76,74,72],
    [74,0,74,76,74,0,71,0],
    [76,0,76,74,72,0,74,76],
    [77,0,81,77,76,0,74,72],
    [79,0,79,76,74,0,71,74],
    [71,0,76,0,75,76,0,0]
  ];
  const BASSP=[1,0,1,1,1,0,1,2];
  function mk(){
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return false;
    ctx=new AC(); master=ctx.createGain(); master.gain.value=0;
    const comp=ctx.createDynamicsCompressor(); master.connect(comp); comp.connect(ctx.destination);
    noise=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);
    const d=noise.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    try{ const b=ctx.createBuffer(1,1,22050), s=ctx.createBufferSource(); s.buffer=b; s.connect(ctx.destination); s.start(0); }catch(e){}
    return true;
  }
  function env(g,t,a,peak,dur){
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(peak,t+a);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  }
  function kick(t){
    const o=ctx.createOscillator(),g=ctx.createGain(); o.type='sine';
    o.frequency.setValueAtTime(155,t); o.frequency.exponentialRampToValueAtTime(42,t+.14);
    env(g,t,.004,.95,.28); o.connect(g); g.connect(master); o.start(t); o.stop(t+.32);
  }
  function hit(t,type,freq,peak,dur,q){
    const s=ctx.createBufferSource(); s.buffer=noise;
    const f=ctx.createBiquadFilter(); f.type=type; f.frequency.value=freq; if(q) f.Q.value=q;
    const g=ctx.createGain(); env(g,t,.002,peak,dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(t,Math.random()*.5); s.stop(t+dur+.03);
  }
  function clap(t){ hit(t,'bandpass',1500,.5,.05,1.2); hit(t+.011,'bandpass',1700,.45,.05,1.2); hit(t+.024,'bandpass',1500,.6,.22,1.0); }
  function swell(t,dur){
    const s=ctx.createBufferSource(); s.buffer=noise; s.loop=true;
    const f=ctx.createBiquadFilter(); f.type='bandpass'; f.Q.value=.8;
    f.frequency.setValueAtTime(700,t); f.frequency.exponentialRampToValueAtTime(2400,t+dur);
    const g=ctx.createGain(); g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(.09,t+dur*.8); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t+dur+.05);
  }
  function osc(t,m,type,peak,dur,cut,att,det){
    const o=ctx.createOscillator(); o.type=type; o.frequency.value=hz(m); if(det) o.detune.value=det;
    const f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=cut;
    const g=ctx.createGain(); env(g,t,att,peak,dur);
    o.connect(f); f.connect(g); g.connect(master); o.start(t); o.stop(t+dur+.05);
  }
  function play(i,t){
    const bar=(i/8)|0, s=i%8, ch=CH[bar];
    if(s===0) ch[1].forEach(m=>osc(t,m,'triangle',.05,EIGHTH*8,1500,.25));
    const bp=BASSP[s];
    if(bp===1) osc(t,ch[0],'sawtooth',.26,EIGHTH*.92,420,.01);
    if(bp===2) osc(t,ch[0]+7,'sawtooth',.24,EIGHTH*.92,420,.01);
    if(s%2===0) kick(t);
    if(s===2||s===6||(bar===7&&s===7)) clap(t);
    if(s%2) hit(t,'highpass',7000,.13,.09); else hit(t,'highpass',8000,.07,.04);
    if(i%32===0) swell(t,EIGHTH*14);
    const m=MEL[bar][s];
    if(m){
      const nxt=MEL[bar][(s+1)%8], d=nxt?EIGHTH*.95:EIGHTH*1.9;
      osc(t,m,'sawtooth',.05,d,3400,.012,-7); osc(t,m,'sawtooth',.05,d,3400,.012,7); osc(t,m+12,'square',.012,d,2600,.012,0);
    }
  }
  function pump(){
    while(nextT<ctx.currentTime+.15){ play(step,nextT); nextT+=EIGHTH; step=(step+1)%LOOP; }
  }
  function fade(v){
    if(!master) return; const t=ctx.currentTime;
    master.gain.cancelScheduledValues(t); master.gain.setTargetAtTime(v,t,.3);
  }
  function begin(){
    if(started||!enabled||held||!ctx||ctx.state!=='running') return;
    started=true; nextT=ctx.currentTime+.08; step=0;
    timer=setInterval(pump,40); fade(VOL);
  }
  function start(){
    if(!enabled||held) return;
    if(!ctx&&!mk()) return;
    if(ctx.state!=='running'){ try{ ctx.resume().then(begin).catch(()=>{}); }catch(e){} }
    else begin();
  }
  function halt(){
    clearInterval(timer); timer=null; started=false; try{ctx.suspend()}catch(e){}
  }
  function set(on){
    enabled=on; try{localStorage.setItem(KEY,on?'1':'0')}catch(e){}
    if(on) start();
    else if(started){ fade(0); setTimeout(()=>{ if(!enabled) halt(); },900); }
  }
  // قبل از شروع گزارش بازی آروم قطع می‌شه و با برگشتن به مراحل قبل دوباره پخش می‌شه
  function hold(h){
    held=h;
    if(h){ if(started){ fade(0); setTimeout(()=>{ if(held) halt(); },1000); } }
    else start();
  }
  document.addEventListener('visibilitychange',()=>{
    if(!ctx||!started) return;
    try{ document.hidden ? ctx.suspend() : (enabled&&!held&&ctx.resume()); }catch(e){}
  });
  return {start,set,hold,on:()=>enabled,playing:()=>started&&!!ctx&&ctx.state==='running'};
})();

/* ================= افکت‌های صوتی (سکه) ================= */
const SFX=(()=>{
  let c=null,nb=null;
  function get(){
    if(!c){
      const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null;
      c=new AC(); nb=c.createBuffer(1,c.sampleRate,c.sampleRate);
      const d=nb.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    }
    if(c.state==='suspended') c.resume();
    return c;
  }
  function env(g,t,v,a,dur){
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(Math.max(v,0.0002),t+a);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  }
  // صدای فلزی: چند هارمونیک ناهمسان مثل سکه‌ی واقعی
  function metal(f,v,dur,dl=0){
    const a=get(); if(!a) return; const t=a.currentTime+dl;
    [[1,1],[2.76,.6],[5.4,.35],[8.93,.2]].forEach(([r,m],i)=>{
      const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=f*r;
      env(g,t,v*m,.003,dur/(1+i*.7)); o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+.05);
    });
  }
  function hiss(type,f1,f2,q,v,dur,dl=0){
    const a=get(); if(!a) return; const t=a.currentTime+dl;
    const s=a.createBufferSource(); s.buffer=nb;
    const f=a.createBiquadFilter(); f.type=type; f.Q.value=q;
    f.frequency.setValueAtTime(f1,t); f.frequency.exponentialRampToValueAtTime(f2,t+dur);
    const g=a.createGain(); g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(v,t+dur*.35); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.connect(f); f.connect(g); g.connect(a.destination); s.start(t,Math.random()*.4); s.stop(t+dur+.05);
  }
  function note(f,v,dur,dl){
    const a=get(); if(!a) return; const t=a.currentTime+dl;
    const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f;
    env(g,t,v,.01,dur); o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+.05);
  }
  return {
    flick(){ metal(2600,.32,.6); hiss('highpass',4000,6000,.7,.2,.05); },
    whoosh(d){ hiss('bandpass',450,1700,1.3,.13,d*.55); hiss('bandpass',1700,450,1.3,.1,d*.45,d*.55); },
    tick(v){ metal(3400,v,.08); },
    land(v){ metal(1750,.42*v,.25+.5*v); hiss('bandpass',3200,2600,2,.35*v,.07); },
    rattle(v){ metal(2000+Math.random()*350,.22*v,.07); },
    chime(){ [1046.5,1318.5,1568,2093].forEach((f,i)=>note(f,.11,.9,i*.08)); }
  };
})();

/* ================= جرقه‌های فسفری ================= */
(()=>{
  const cv=$('#embers'), c=cv.getContext('2d');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W=0,H=0,dpr=1,ps=[],last=0,raf=0,tmr=0;
  function sprite(r,g,b){
    const s=document.createElement('canvas'); s.width=s.height=64; const x=s.getContext('2d');
    const gr=x.createRadialGradient(32,32,0,32,32,32);
    gr.addColorStop(0,'rgba(255,255,255,.95)');
    gr.addColorStop(.18,`rgba(${r},${g},${b},.9)`);
    gr.addColorStop(.5,`rgba(${r},${g},${b},.25)`);
    gr.addColorStop(1,`rgba(${r},${g},${b},0)`);
    x.fillStyle=gr; x.fillRect(0,0,64,64); return s;
  }
  const SP=[sprite(255,106,43),sprite(255,179,71),sprite(255,70,30)];
  function mkp(init){
    return {x:Math.random()*W, y:init?Math.random()*H:H+20*dpr,
      s:(8+Math.random()*18)*dpr, vy:(18+Math.random()*46)*dpr,
      sw:Math.random()*6.28, sa:(8+Math.random()*22)*dpr, sf:.4+Math.random()*1.2,
      a:.55+Math.random()*.45, k:(Math.random()*3)|0};
  }
  function size(){
    dpr=Math.min(window.devicePixelRatio||1,1.5);
    W=cv.width=Math.round(innerWidth*dpr); H=cv.height=Math.round(innerHeight*dpr);
    const n=reduce?10:(innerWidth<600?34:56);
    ps=Array.from({length:n},()=>mkp(true));
  }
  function frame(t){
    const dt=Math.min(.05,(t-last)/1000||.016); last=t;
    c.clearRect(0,0,W,H); c.globalCompositeOperation='lighter';
    for(const p of ps){
      p.y-=p.vy*dt; p.sw+=p.sf*dt;
      const fade=Math.max(0,Math.min(1,(p.y/H)*1.6));
      c.globalAlpha=p.a*fade*(.75+.25*Math.sin(p.sw*3));
      c.drawImage(SP[p.k],p.x+Math.sin(p.sw)*p.sa-p.s/2,p.y-p.s/2,p.s,p.s);
      if(p.y<-20*dpr) Object.assign(p,mkp(false));
    }
    c.globalAlpha=1; raf=requestAnimationFrame(frame);
  }
  function run(){ cancelAnimationFrame(raf); last=performance.now(); raf=requestAnimationFrame(frame); }
  addEventListener('resize',()=>{ clearTimeout(tmr); tmr=setTimeout(size,150); });
  document.addEventListener('visibilitychange',()=>{ document.hidden?cancelAnimationFrame(raf):run(); });
  size(); run();
})();

/* ================= داده‌ی بازی ================= */
const COLORS=[
  {id:'blue', name:'آبی',  hex:'#2f6bff'},
  {id:'black',name:'مشکی', hex:'#171a22'},
  {id:'white',name:'سفید', hex:'#f2f4fa'},
  {id:'red',  name:'قرمز', hex:'#e63946'}
];
const FORMS=['4-4-2','4-3-3','4-2-3-1','4-5-1','3-5-2','3-4-3','5-3-2','4-1-4-1','4-4-1-1','5-4-1'];
const G={ teams:[{name:'',color:null,form:null},{name:'',color:null,form:null}], coin:null };
const ui={busy:false,ft:0,coinAngle:0};

const norm=s=>s.replace(/[‌‍\s]+/g,'').replace(/ي/g,'ی').replace(/ك/g,'ک').toLowerCase();
const tname=t=>G.teams[t].name.trim()||('تیم '+fa(t+1));
const colorHex=t=>{const c=COLORS.find(x=>x.id===G.teams[t].color);return c?c.hex:null;};
const colorName=t=>{const c=COLORS.find(x=>x.id===G.teams[t].color);return c?c.name:null;};
const JERSEY=t=>`<svg class="jersey" viewBox="0 0 64 64" style="--jc:${colorHex(t)||'#3a4160'}" aria-hidden="true"><path d="M20 6L8 14L3 28L14 32L16 26V58H48V26L50 32L61 28L56 14L44 6C40 11 24 11 20 6Z"/></svg>`;
function namesDup(){
  const a=norm(G.teams[0].name), b=norm(G.teams[1].name);
  return !!(a&&b&&a===b);
}
function teamsOk(){
  return G.teams.every(t=>t.name.trim().length>0 && t.color) && !namesDup();
}
function formsOk(){ return G.teams.every(t=>t.form); }

/* ================= توپ (پنج‌ضلعی‌های واقعی با درز) ================= */
function ballSVG(){
  const cx=60,cy=60,r=15.5,d=46, rad=a=>a*Math.PI/180;
  const pt=(x,y,rr,a)=>[x+rr*Math.cos(rad(a)),y+rr*Math.sin(rad(a))];
  const poly=(x,y,rr,a0)=>Array.from({length:5},(_,j)=>pt(x,y,rr,a0+72*j));
  const P=a=>a.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const F=p=>p[0].toFixed(1)+' '+p[1].toFixed(1);
  let patches=`<polygon points="${P(poly(cx,cy,r,-90))}"/>`, seams='';
  for(let k=0;k<5;k++){
    const a=-90+72*k, [ox,oy]=pt(cx,cy,d,a), outer=poly(ox,oy,r,a+180);
    patches+=`<polygon points="${P(outer)}"/>`;
    seams+=`M${F(pt(cx,cy,r,a))}L${F(outer[0])}`;
    const a2=a+72, [ox2,oy2]=pt(cx,cy,d,a2), outer2=poly(ox2,oy2,r,a2+180);
    seams+=`M${F(outer[4])}L${F(outer2[1])}`;
  }
  return `<svg class="ball" viewBox="0 0 120 120" aria-hidden="true">
  <defs>
    <radialGradient id="bb" cx="38%" cy="32%" r="78%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d4dae9"/></radialGradient>
    <radialGradient id="bs" cx="38%" cy="32%" r="80%"><stop offset=".5" stop-color="#0a0e28" stop-opacity="0"/><stop offset="1" stop-color="#0a0e28" stop-opacity=".42"/></radialGradient>
    <clipPath id="bc"><circle cx="60" cy="60" r="54"/></clipPath>
  </defs>
  <circle cx="60" cy="60" r="54" fill="url(#bb)"/>
  <g clip-path="url(#bc)">
    <g fill="#14192e" stroke="#14192e" stroke-width="1.6" stroke-linejoin="round">${patches}</g>
    <path d="${seams}" stroke="#14192e" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  </g>
  <circle cx="60" cy="60" r="54" fill="url(#bs)"/>
  <circle cx="60" cy="60" r="54" fill="none" stroke="#0b1020" stroke-width="2"/>
  <ellipse cx="42" cy="32" rx="14" ry="7" fill="#fff" opacity=".35" transform="rotate(-32 42 32)"/>
</svg>`;
}

function miniPitch(f,color){
  const L=f.split('-').map(Number), n=L.length; let d='';
  L.forEach((m,i)=>{
    const y=n===1?35:58-i*(46/(n-1));
    for(let j=0;j<m;j++){ const x=60*(j+1)/(m+1); d+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.6"/>`; }
  });
  return `<svg viewBox="0 0 60 80" aria-hidden="true"><rect width="60" height="80" rx="6" fill="#0e2a1d"/>
  <rect x="3" y="3" width="54" height="74" rx="3" fill="none" stroke="rgba(255,255,255,.28)"/>
  <line x1="3" y1="40" x2="57" y2="40" stroke="rgba(255,255,255,.22)"/><circle cx="30" cy="40" r="7" fill="none" stroke="rgba(255,255,255,.22)"/>
  <g fill="${color}" stroke="rgba(255,255,255,.8)" stroke-width="1"><circle cx="30" cy="72" r="3.6"/>${d}</g></svg>`;
}

/* ================= مراحل ================= */
const STEPS=[
  {id:'welcome',  label:'شروع',          cta:'شروع بازی'},
  {id:'teams',    label:'اسم و رنگ تیم‌ها', ok:teamsOk, cta:()=>teamsOk()?'بعدی':'اسم و رنگ هر دو تیم رو کامل کن'},
  {id:'formation',label:'ترکیب',         ok:formsOk, cta:()=>formsOk()?'بعدی':'ترکیب هر دو تیم رو انتخاب کن',},
  {id:'coin',     label:'پرتاب سکه',     ok:()=>true, cta:()=>G.coin?'بعدی':'پرتاب سکه', action:()=>{ if(!G.coin){ toss(); return true; } return false; }},
  {id:'draft',    label:'انتخاب بازیکن', hint:'بازیکن‌ها، مربی، داور و زننده‌ها رو اینجا انتخاب می‌کنید'},
  {id:'match',    label:'بازی',          hint:'سوت شروع، گزارش زنده و نتیجه‌ی بازی اینجا اتفاق می‌افته'}
];
const state={step:0,max:0};
const stage=$('#stage'), dots=$('#dots'), lab=$('#stepLabel');
const btnBack=$('#btnBack'), btnFwd=$('#btnFwd'), btnNext=$('#btnNext');
STEPS.forEach(()=>dots.appendChild(document.createElement('i')));

const SCREENS={};

SCREENS.welcome=el=>{
  el.innerHTML=`
    <div class="hero">${ballSVG()}</div>
    <h1 class="title">دربی رویایی</h1>
    <p class="sub">تیم رویایی‌ت رو از بین افسانه‌های فوتبال بچین<br>و گزارش زنده‌ی بازی رو ببین</p>
    <div class="chips"><span class="chip">۲ تا ۴ نفره</span><span class="chip">افسانه‌های فوتبال</span><span class="chip">گزارش زنده</span></div>`;
};

/* ---- اسم و رنگ ---- */
SCREENS.teams=el=>{
  el.classList.add('top');
  el.innerHTML=[0,1].map(t=>`
    <div class="tcard">
      <div class="thead">${JERSEY(t)}<span class="tag">بازیکن ${fa(t+1)}</span><span class="tcol" data-colname="${t}"></span></div>
      <input class="tin" data-t="${t}" maxlength="16" dir="auto" autocomplete="off" autocapitalize="off" spellcheck="false"
        placeholder="${t?'اسم تیمت رو بنویس (غیر از تیم اول)':'اسم تیمت رو بنویس (مثلاً بارسلونا)'}" value="${esc(G.teams[t].name)}">
      <div class="err" data-err="${t}"></div>
      <div class="sws" role="group" aria-label="رنگ لباس">${COLORS.map(c=>`<button class="sw" data-t="${t}" data-c="${c.id}" style="--c:${c.hex}" aria-label="${c.name}"></button>`).join('')}</div>
    </div>`).join('');
  const upd=()=>{
    const dup=namesDup();
    el.querySelectorAll('.tin')[1].classList.toggle('bad',dup);
    el.querySelector('[data-err="1"]').textContent=dup?'این اسم قبلاً انتخاب شده، یه اسم دیگه بنویس':'';
    [0,1].forEach(t=>{
      el.querySelectorAll('.jersey')[t].style.setProperty('--jc',colorHex(t)||'#3a4160');
      el.querySelector(`[data-colname="${t}"]`).textContent=colorName(t)?`لباس ${colorName(t)}`:'رنگ لباس رو انتخاب کن';
    });
    el.querySelectorAll('.sw').forEach(s=>{
      const t=+s.dataset.t, c=s.dataset.c;
      s.classList.toggle('sel',G.teams[t].color===c);
      s.disabled=G.teams[1-t].color===c;
    });
    chrome();
  };
  el.addEventListener('input',e=>{
    const i=e.target.closest('.tin'); if(!i) return;
    G.teams[+i.dataset.t].name=i.value; G.coin=null; upd();
  });
  el.addEventListener('click',e=>{
    const b=e.target.closest('.sw'); if(!b||b.disabled) return;

const glowColor=t=>G.teams[t].color==='black'?'#f6c453':colorHex(t);
SCREENS.coin=el=>{
  const c0=colorHex(0), c1=colorHex(1);
  const edges=Array.from({length:11},(_,i)=>`<i class="edge" style="transform:translateZ(${i-5}px)"></i>`).join('');
  const face=(cls,t,c)=>`<div class="face ${cls}" style="--c:${c}"><i class="in"></i><i class="star">★ ★ ★</i><b class="lbl">${esc(tname(t))}</b><i class="shine"></i></div>`;
  el.innerHTML=`<div class="vs"><span><i class="dot" style="--c:${c0}"></i><em>${esc(tname(0))}</em></span><b>در برابر</b><span><i class="dot" style="--c:${c1}"></i><em>${esc(tname(1))}</em></span></div>
    <div class="toss" id="toss"><i class="cshadow" id="cshadow"></i><div class="hop" id="hop"><div class="coin" id="coin">${edges}${face('f',0,c0)}${face('b',1,c1)}</div></div></div>
    <div class="coinres" id="coinres"><p>روی سکه بزن یا دکمه‌ی پایین رو بزن تا پرتاب بشه</p></div>`;
  ui.coinAngle=G.coin?G.coin.angle:0;
  const box=el.querySelector('#toss');
  el.querySelector('#coin').style.transform=`rotateX(${ui.coinAngle}deg)`;
  box.addEventListener('click',()=>{ if(!G.coin&&!ui.busy) toss(); });
  if(G.coin){ box.style.setProperty('--wc',glowColor(G.coin.winner)); box.classList.add('won'); showCoinRes(el); }
};
function celebrate(box,w){
  const sc=glowColor(w);
  box.style.setProperty('--wc',sc); box.classList.add('won');
  const frag=document.createDocumentFragment();
  const ring=document.createElement('i'); ring.className='ring'; ring.style.setProperty('--sc',sc); frag.appendChild(ring);
  for(let i=0;i<24;i++){
    const s=document.createElement('i'); s.className='spark';
    const a=Math.random()*Math.PI*2, d=85+Math.random()*85;
    s.style.setProperty('--dx',(Math.cos(a)*d).toFixed(0)+'px');
    s.style.setProperty('--dy',(Math.sin(a)*d).toFixed(0)+'px');
    s.style.setProperty('--sc',i%2?sc:'#ffd77a');
    s.style.animationDelay=(Math.random()*90).toFixed(0)+'ms';
    frag.appendChild(s);
  }
  box.appendChild(frag);
  setTimeout(()=>box.querySelectorAll('.spark,.ring').forEach(n=>n.remove()),1300);
}
function toss(){
  const el=stage.querySelector('.screen'); if(!el||ui.busy||G.coin) return;
  const box=el.querySelector('#toss'), hop=el.querySelector('#hop'), coin=el.querySelector('#coin'), sh=el.querySelector('#cshadow');
  ui.busy=true; chrome();
  box.classList.remove('won');
  el.querySelector('#coinres').innerHTML='<p>سکه در هواست...</p>';
  const winner=Math.random()<.5?0:1;
  const A0=ui.coinAngle||0;
  const AF=Math.ceil((A0+1)/360)*360+360*6+(winner?180:0);   // روی صفر = تیم ۱، روی ۱۸۰ = تیم ۲
  const CR=170, FL=1350, LAND=CR+FL, WOB=1500, END=LAND+WOB, H=150;
  let t0=null, lastHalf=Math.floor(A0/180), lastSign=0, flicked=false;
  const bounced=[false,false,false];
  function set(y,s,ax,az,h){
    hop.style.transform=`translateY(${y.toFixed(1)}px) scale(${s.toFixed(3)})`;
    coin.style.transform=`rotateZ(${az.toFixed(2)}deg) rotateX(${ax.toFixed(2)}deg)`;
    coin.style.setProperty('--b',(.72+.4*Math.abs(Math.cos(ax*Math.PI/180))).toFixed(3));
    sh.style.transform=`scale(${(1-.6*h).toFixed(3)})`; sh.style.opacity=(1-.75*h).toFixed(3);
  }
  function finish(show){
    set(0,1,AF,0,0); ui.coinAngle=AF; G.coin={winner,angle:AF}; ui.busy=false;
    if(show&&stage.contains(el)){ celebrate(box,winner); showCoinRes(el); SFX.chime(); }
    chrome();
  }
  function frame(now){
    if(t0===null) t0=now;
    const t=now-t0;
    if(!stage.contains(el)){ finish(false); return; }
    if(t<CR){                                   // آماده‌ی پرتاب با شست
      const k=Math.sin(t/CR*Math.PI); set(7*k,1-.05*k,A0,0,0);
    } else if(t<LAND){                          // پرواز: بالا می‌ره، می‌چرخه، میاد پایین
      if(!flicked){ flicked=true; SFX.flick(); SFX.whoosh(FL/1000); }
      const p=(t-CR)/FL, h=4*p*(1-p);
      const ang=A0+(AF-A0)*(.7*p+.3*p*(2-p));
      const half=Math.floor(ang/180);
      if(half!==lastHalf){ lastHalf=half; SFX.tick(.03+.05*h); }
      set(-H*h,1+.38*h,ang,14*Math.sin(p*Math.PI),h);
    } else if(t<END){                           // فرود، دو بار جهش، بعد لق می‌خوره و می‌خوابه
      const bt=t-LAND, w=bt/1000, dec=Math.exp(-w/.42);
      const ph=2*Math.PI*(4.5*w+7*w*w);
      const s=Math.sin(ph);
      let y=0;
      if(bt<240) y=-24*Math.sin(bt/240*Math.PI);
      else if(bt<390) y=-8*Math.sin((bt-240)/150*Math.PI);
      if(!bounced[0]){ bounced[0]=true; SFX.land(1); }
      if(bt>=240&&!bounced[1]){ bounced[1]=true; SFX.land(.55); }
      if(bt>=390&&!bounced[2]){ bounced[2]=true; SFX.land(.3); }
      const sg=s>=0?1:-1;
      if(bt>400&&sg!==lastSign&&dec>.06) SFX.rattle(dec);
      lastSign=sg;
      set(y,1,AF+38*dec*s,10*dec*Math.cos(ph),-y/H);
    } else { finish(true); return; }
    requestAnimationFrame(frame);
  }
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){ finish(true); return; }
  requestAnimationFrame(frame);
}

const SLOTFA={GK:'دروازه‌بان',CB:'دفاع وسط',RB:'دفاع راست',LB:'دفاع چپ',CDM:'هافبک دفاعی',CM:'هافبک وسط',CAM:'هافبک هجومی',RM:'هافبک راست',LM:'هافبک چپ',CF:'پشت مهاجم',RW:'مهاجم راست',ST:'مهاجم نوک',LW:'مهاجم چپ'};
const PRI=['GK','CB','RB','LB','CDM','CM','CAM','RM','LM','CF','RW','ST','LW'];
const EQ={RM:'RW',RW:'RM',LM:'LW',LW:'LM'};            // کناری‌ها با هم هم‌ارزن
const LINES={
 '4-4-2':[['RB','CB','CB','LB'],['RM','CM','CM','LM'],['ST','ST']],
 '4-3-3':[['RB','CB','CB','LB'],['CM','CM','CM'],['RW','ST','LW']],
 '4-2-3-1':[['RB','CB','CB','LB'],['CDM','CDM'],['RM','CAM','LM'],['ST']],
 '4-5-1':[['RB','CB','CB','LB'],['RM','CM','CM','CM','LM'],['ST']],
 '3-5-2':[['CB','CB','CB'],['RM','CM','CM','CM','LM'],['ST','ST']],
 '3-4-3':[['CB','CB','CB'],['RM','CM','CM','LM'],['RW','ST','LW']],
 '5-3-2':[['RB','CB','CB','CB','LB'],['CM','CM','CM'],['ST','ST']],
 '4-1-4-1':[['RB','CB','CB','LB'],['CDM'],['RM','CM','CM','LM'],['ST']],
 '4-4-1-1':[['RB','CB','CB','LB'],['RM','CM','CM','LM'],['CF'],['ST']],
 '5-4-1':[['RB','CB','CB','CB','LB'],['RM','CM','CM','LM'],['ST']]
};
const fits=(p,c)=>c==='GK'?!!p.gk:(!p.gk&&(p.pos.includes(c)||(!!EQ[c]&&p.pos.includes(EQ[c]))));
function buildSlots(f){
  const L=LINES[f], n=L.length, out=[{c:'GK',x:50,y:90}];
  L.forEach((ln,li)=>{ const y=74-li*(60/(n-1||1)); ln.forEach((c,j)=>out.push({c,x:100-100*(j+1)/(ln.length+1),y})); });
  return out;
}
const PART=['de','van','ter','da'];
function short(p){
  const w=p.en.split(' ');
  if(w.length===1||PART.includes(w[0].toLowerCase())) return p.en;
  return w[0][0]+'. '+w.slice(1).join(' ');
}

/* جستجوی هوشمند: فارسی/انگلیسی، غلط‌نویسی و صداهای مشابه */
function nfa(s){
  s=String(s).toLowerCase().normalize('NFD').replace(/[̀-ًͯ-ٰٟـ‌‍]/g,'');
  s=s.replace(/[يى]/g,'ی').replace(/ك/g,'ک').replace(/[ةۀ]/g,'ه').replace(/[أإآٱ]/g,'ا').replace(/ؤ/g,'و').replace(/ئ/g,'ی')
     .replace(/[ثص]/g,'س').replace(/[ذضظ]/g,'ز').replace(/ط/g,'ت').replace(/ح/g,'ه').replace(/غ/g,'ق');
  return s.replace(/[^a-z0-9؀-ۿ\s]/g,' ').replace(/\s+/g,' ').trim();
}
function lev(a,b){
  const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
  let prev=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){ const cur=[i];
    for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    prev=cur; }
  return prev[n];
}
PL.forEach(p=>{ p._k=[nfa(p.en),nfa(p.fa)].map(s=>({full:s.replace(/ /g,''),words:s.split(' ')})); });
function qscore(p,nq){
  const q=nq.replace(/ /g,''); if(!q) return 0;
  const thr=q.length<=3?0:q.length<=6?1:2; let best=null;
  for(const f of p._k){
    if(f.full.includes(q)) return 0;
    for(const w of f.words){
      if(w.startsWith(q)) return 0;
      const d=Math.min(lev(w,q),lev(w.slice(0,q.length),q));
      if(d<=thr&&(best===null||d+1<best)) best=d+1;
    }
  }
  return best;
}

const nmHTML=p=>{ const n=short(p).length; return `<span class="nm${n>10?' xl':n>7?' lg':''}">${esc(short(p))}</span>`; };
function pitchHTML(t,mode){
  const rows={}; D.slots[t].forEach(s=>{ const k=s.y.toFixed(1); rows[k]=(rows[k]||0)+1; });
  const cur=mode==='p'?D.seq[D.pos]:null, tk=mode==='tk'?D.seq[D.pos]:null;
  const sl=D.slots[t].map((s,i)=>{
    const pk=D.pick[t][i]; let cls='slot', inner;
    let bd=(D.pen[t]===i?'<b class="bd">P</b>':'')+(D.set[t]===i?'<b class="bd sb">S</b>':'');
    if(pk){
      const p=PL[pk.pid]; if(pk.wrong) cls+=' bad';

  }).join('');

}
function stageHTML(c){

    el.querySelector('#dt2').textContent=sub;

  }

    if(done()) return;
    const c=D.seq[D.pos], nq=nfa(D.q), sc=c.k==='p'?D.slots[c.t][c.sid].c:null;
    const list=listItems(c).map((x,i)=>({...x,i,s:qscore(x.p,nq)})).filter(x=>x.s!==null)
      .sort((a,b)=>(a.taken-b.taken)||((a.tier||0)-(b.tier||0))||(a.s-b.s)||(a.i-b.i));
    strip.innerHTML=list.length?list.map(({p,taken,tier})=>`<button class="pc${D.sel===p.id?' sel':''}${taken?' off':''}${tier===2?' bad':''}" data-id="${p.id}">${iconFor(p,c.t)}<b class="en">${esc(p.en)}</b><span class="fa">${esc(p.fa)}</span><span class="pp">${pills(p,sc)}</span></button>`).join(''):'<div class="nores">پیدا نشد 🤔</div>';
    strip.scrollLeft=0;
  }
  function all(){ q.value=D.q; drawTop(); drawStrip(); }

  el.addEventListener('click',e=>{

    if(b){ D.sel=+b.dataset.id; strip.querySelectorAll('.pc').forEach(x=>x.classList.toggle('sel',+x.dataset.id===D.sel)); drawTop(); chrome(); return; }

      else if(l.k==='c'){ D.takenC.delete(D.coach[l.t]); D.coach[l.t]=null; }
      else if(l.k==='r'){ D.ref=null; }
      else if(l.k==='pen'){ D.pen[l.t]=null; }
      else { D.set[l.t]=null; }
      D.sel=null; D.q=''; all(); chrome();
    }
  });

};

/* ================= صدای ورزشگاه: تماشاچی، سوت، توپ ================= */
const Arena=(()=>{
  let c=null,nb=null,master=null,crowd=null,on=true,run=false;
  function ctx(){
    if(!on) return null;
    if(!c){
      const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null;
      c=new AC(); master=c.createGain(); master.gain.value=.9; master.connect(c.destination);
      nb=c.createBuffer(1,c.sampleRate*3,c.sampleRate);
      const d=nb.getChannelData(0); let b0=0,b1=0,b2=0;
      for(let i=0;i<d.length;i++){ const w=Math.random()*2-1; b0=.99765*b0+w*.099; b1=.963*b1+w*.2965; b2=.57*b2+w*1.05; d[i]=(b0+b1+b2+w*.18)*.22; }
    }
    if(c.state==='suspended') c.resume();
    return c;
  }
  function src(a,loop){ const s=a.createBufferSource(); s.buffer=nb; s.loop=!!loop; return s; }
  function startCrowd(){
    const a=ctx(); if(!a||crowd) return; run=true;
    const t=a.currentTime, out=a.createGain(); out.gain.value=.0001; out.connect(master);
    const mk=(f,q,g,type)=>{ const s=src(a,true), fl=a.createBiquadFilter(), gg=a.createGain(); fl.type=type||'bandpass'; fl.frequency.value=f; fl.Q.value=q; gg.gain.value=g; s.connect(fl); fl.connect(gg); gg.connect(out); s.start(t,Math.random()*2); return {s,fl,gg}; };
    const l1=mk(520,.45,1), l2=mk(1250,.6,.55), l3=mk(210,.5,1.1,'lowpass');
    const lfo=a.createOscillator(), lg=a.createGain(); lfo.frequency.value=.17; lg.gain.value=.012; lfo.connect(lg); lg.connect(out.gain); lfo.start(t);
    out.gain.exponentialRampToValueAtTime(.085,t+2.2);
    crowd={out,l1,l2,l3,lfo};
  }
  function level(v,dur){ if(!crowd||!c) return; const t=c.currentTime; crowd.out.gain.cancelScheduledValues(t); crowd.out.gain.setValueAtTime(Math.max(crowd.out.gain.value,.0001),t); crowd.out.gain.exponentialRampToValueAtTime(Math.max(v,.0002),t+(dur||1)); }
  function stopCrowd(){
    if(!crowd||!c) return; const k=crowd, t=c.currentTime; crowd=null; run=false;
    k.out.gain.cancelScheduledValues(t); k.out.gain.setValueAtTime(Math.max(k.out.gain.value,.0001),t); k.out.gain.exponentialRampToValueAtTime(.0001,t+.7);
    setTimeout(()=>{ try{ k.l1.s.stop(); k.l2.s.stop(); k.l3.s.stop(); k.lfo.stop(); k.out.disconnect(); }catch(e){} },900);
  }

/* ---------- پاراگراف اول: حال‌وهوا ---------- */
function introText(ev,X,Y,S){
  const m=ev.min; let ph;
  if(ev.et) ph='et'; else if(ev.half===1) ph=m<=14?'e1':m>=37?'l1':'m1'; else ph=m<=56?'e2':m>=80?'l2':'m2';
  const sc=ev.pre, a=sc[ev.t], b=sc[1-ev.t];
  const st=(a===0&&b===0)?'zero':a>b?'lead':a<b?'trail':'level';
  const out=[];
  if(!ev.kick&&chance(.72)) out.push(say(INTRO[ph]));
  const r=Math.random();
  if(r<.42) out.push(F(say(STATEP[st])));
  else if(r<.72){ const ks=X.co.im.concat(X.co.ex).filter(k=>COACHP[k]); if(ks.length) out.push(F(say(COACHP[oneOf(ks)]))); }
  if(!out.length&&!ev.kick) out.push(say(INTRO[ph]));
  return out.join('\n');
}
function afterGoal(ev,X,Y,S){
  const out=[F(say(GOALCRY)),SAY(AFTERG)];
  if(ev.A&&!['solo','long','pen','fk'].includes(ev.gt)&&chance(.5)) out.push(F(AFTER_AST));
  else if(chance(.6)) out.push(SAY(AFTER_CON));
  if(Y.co.ex.includes('regroup')&&chance(.8)) out.push(F(AFTER_REG));
  else if(chance(.25)) out.push(F(AFTER_COA));
  if(ev.min>=70&&X.co.ex.includes('goldsub')) out.push(F(AFTER_GOLD));
  else if(ev.min>=80&&chance(.5)) out.push(F(AFTER_LATE));
  return out.join('\n');
}

  if(ev.kick){ CX.P=ev.kick.nm; CX.T=ev.kick.team; beats.unshift(SAY(KICK[ev.kick.key])); CX.T=X.name; }
